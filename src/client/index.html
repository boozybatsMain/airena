<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIRENA — living machines, endless battles</title>
<!-- The browser's own chrome joins the page's ground rather than sitting on a
     white band above it: on a phone the address bar and the status bar take
     this colour, and the warm off-white is the palette's `--sky` (§2.1). -->
<meta name="theme-color" content="#EBE1D9">

<!--
  The import map comes FIRST and lives in <head>: the browser resolves module
  specifiers at preload time, and a `modulepreload` placed before the map fails
  with "Failed to resolve module specifier 'three'" and loads the module twice.
  Minified builds on purpose: first-frame budget (tools/checkboot.mjs).
-->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three.webgpu.min.js",
  "three/webgpu": "/vendor/three.webgpu.min.js",
  "three/tsl": "/vendor/three.tsl.min.js",
  "three/addons/": "/vendor-addons/",
  "@genex-ai/embed-sdk": "/vendor-genex/index.js"
} }
</script>

<!--
  Where the backend lives. Static files may be served by GENEX while the API
  runs elsewhere; the build stamps this meta (`tools/build.mjs --api=`), and
  `?api=` in the address overrides it for a one-off check. Empty = same host.
-->
<meta name="airena-backend" content="">
<meta name="genex-slug" content="">
<script>
window.__api = (function () {
  try {
    var q = new URLSearchParams(location.search).get('api');
    var m = document.querySelector('meta[name="airena-backend"]');
    var v = String(q || (m && m.content) || '').trim().replace(/\/+$/, '');
    return /^https?:\/\/[^/]+$/.test(v) ? v : '';
  } catch (e) { return ''; }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232E2E33' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF7A5C'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/spacegrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="/vendor/three.webgpu.min.js">
<link rel="modulepreload" href="/vendor/three.core.min.js">
<link rel="modulepreload" href="/vendor/three.tsl.min.js">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/components.css">
<link rel="stylesheet" href="/ui/chrome.css">
<link rel="stylesheet" href="/ui/hud.css">
<link rel="stylesheet" href="/ui/screens/live.css">
<link rel="stylesheet" href="/ui/screens/create.css">
<link rel="stylesheet" href="/ui/screens/birth.css">
<link rel="stylesheet" href="/ui/screens/creature.css">
<link rel="stylesheet" href="/ui/screens/history.css">
<link rel="stylesheet" href="/ui/screens/ladder.css">
<link rel="stylesheet" href="/ui/screens/worker.css">
</head>
<body data-screen="" data-phase="connecting" data-ground="none">

<!-- The navigation is the LAST layer in the document (§4.2), so on a ladder
     showing a hundred rows a keyboard passes all of them before it reaches
     LIVE / CREATURE / HISTORY / LADDER. This is the way past, and it is invisible
     until it has focus (ui/base.css `.skip`). A button and not an anchor: every
     address in this product is a hash, and `href="#chrome"` would be read by the
     router as a route. `app.js` moves focus to the rail. -->
<button class="skip" type="button">Skip to navigation</button>

<!--
  Layers, bottom to top (docs/REDESIGN.md §4.2):
    #arena   the persistent viewer. Never unmounted — a renderer torn down on
             every navigation is the first-frame budget failed on every route.
    #stage   backdrop image + veil for document screens.
    #screen  the current screen (cross-fades).
    #overlay transient cards: VS, result, away recap, fatal.
    #chrome  wordmark, rail, chips.
    #tip     the single tooltip.

  The markup inside #hud is the contract of src/viewer/main.js (§5.1). Ids and
  structure are fixed; styling lives in ui/hud.css.
-->
<div id="arena">
  <div id="vfxflash"></div>
  <div id="hud">
    <div class="bar-wrap" id="bar-oct">
      <div class="col">
        <div class="namerow">
          <div class="name">—</div>
          <div class="sub" id="meta-oct">—</div>
        </div>
        <div class="hprow"><div class="hp"><i style="width:100%"></i><b>— / —</b></div></div>
        <div class="cds"></div>
        <div class="sidetag" data-side="oct"></div>
      </div>
    </div>

    <div class="bar-wrap" id="bar-gor">
      <div class="col">
        <div class="namerow">
          <div class="name">—</div>
          <div class="sub" id="meta-gor">—</div>
        </div>
        <div class="hprow"><div class="hp"><i style="width:100%"></i><b>— / —</b></div></div>
        <div class="cds"></div>
        <div class="sidetag" data-side="gor"></div>
      </div>
    </div>

    <div id="clock">
      <div class="t">0.0</div>
      <div class="s">—</div>
      <div class="byline"></div>
    </div>

    <div id="feedwrap">
      <div class="feed-head"><span class="feed-title">Live feed</span><button class="feed-toggle" type="button" aria-label="Collapse feed"></button></div>
      <div id="feed"></div>
    </div>

    <div id="banner"><div class="box"><div class="who"></div><div class="why"></div></div></div>
    <div id="netstate"></div>
  </div>
  <div id="boot"><div class="boot-in"><canvas class="boot-orbit" width="160" height="160"></canvas><div class="boot-t">Connecting to the arena</div></div></div>

  <!-- Inert sockets main.js queries. Never shown, never focusable. -->
  <div id="devsockets" hidden aria-hidden="true">
    <div id="legend"><div class="lbg"></div><div class="lfr"></div><div class="lin"></div></div>
    <div id="code"><button id="code-close" tabindex="-1"></button><h2></h2><div class="meta"></div><pre></pre></div>
    <div id="err"></div>
    <div id="controls">
      <select id="sel-oct" tabindex="-1"><option value="-"></option></select>
      <select id="sel-gor" tabindex="-1"><option value="-"></option></select>
      <select id="sel-speed" tabindex="-1"><option value="1" selected>1</option></select>
      <input id="seed" tabindex="-1">
      <button id="btn-run" tabindex="-1"></button>
      <input type="checkbox" id="chk-loop" tabindex="-1">
      <button id="btn-cam" tabindex="-1"></button>
    </div>
  </div>
</div>

<!-- TWO GROUNDS, STACKED, CROSS-FADED (ui/base.css).
     The backdrop used to be one element whose background-image, veil gradient
     and backdrop-filter were all rewritten by `body[data-ground]` — none of
     which is a transitionable property, so navigating Create → Creature
     replaced the whole world in one frame under a 600 ms screen cross-fade.
     One layer carries the photograph and its veil, the other the flat blur
     wash the veiled screens stand on, and the ground change fades between
     them on the same clock as the screens above. -->
<div id="stage" aria-hidden="true">
  <div class="ground ground-photo"></div>
  <div class="ground ground-wash"></div>
</div>
<!-- The page had a `nav` landmark and no `main`: a screen reader could jump to
     the navigation and had nothing to jump to from it. `#screen` is the one
     element that always holds the current screen, so it is the landmark. -->
<div id="screen" role="main"></div>
<div id="overlay"></div>
<nav id="chrome" aria-label="Primary"></nav>
<!-- A hash router replaces the whole of `#screen` without a document load, and
     nothing said so: a screen reader was left on a page that had been gone for
     a minute. `app.js` writes the screen's name here once per screen — the same
     word the rail and the tab use — and says nothing on sub-navigation inside
     one screen, where the panel takes focus and answers for itself. -->
<div class="sr" id="say" role="status" aria-live="polite" aria-atomic="true"></div>
<!-- `aria-hidden` from the start: `ui/tooltip.js` only sets it when a tooltip
     CLOSES, so until the player hovered one, an empty `role="tooltip"` node sat
     in the accessibility tree of every screen. -->
<div id="tip" role="tooltip" aria-hidden="true"><div class="tip-title"></div><div class="tip-body"></div></div>

<script type="module" src="/app.js"></script>
</body>
</html>
