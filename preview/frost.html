<!--
  СТЕНД «МОРОЗНОЕ СУЩЕСТВО» — одно существо, три скилла, всё на нашем стеке.

  База — вторая, правильная половина референса: `achrefelouafi/GeometryPainterThreeJS`
  (MIT, `three/webgpu` + TSL, ноль GLSL). Оттуда взяты дословно:
    · геометрия кварца — шестигранная призма с дрожащими КОЛОННАМИ граней
      (угол дрожит один раз на колонну, и рёбра остаются прямыми сверху вниз),
      лёгкое сужение, пирамидальное завершение со сдвинутой вершиной;
    · упругий рост easeOutBack и живая параметризация: инстансы хранят
      ПАРАМЕТРЫ, а не запечённые матрицы, и пересобираются каждый кадр.
  Материал оттуда НЕ взят: у него transmission поверх тёмного задника, а над
  белой платформой §10.1 честная прозрачность показывает белое. Лёд здесь —
  плотное тело со слоями (глубина/френель/прожилки/иней), выверенное на
  стенде /ice против белого пола.

  Три скилла — три класса доставки из грамматики §8:
    1 · ВОЛНА  — разлом идёт от существа к точке, раскрывается в стену клинков;
    2 · ЩИТ    — восемь осколков на орбите; живёт до срока или ломается по
                 ударам (циклы чередуются: один щит разбивают, следующий тает);
    3 · ДОЖДЬ  — телеграф зоны, осыпание сосулек, наросты в местах ударов.

  Правила арены соблюдены и здесь, потому что стенд, который их нарушает,
  ничего не доказывает: тело существа — матовая глина и не светится никогда
  (эмиссия только у скиллов, телеграфов и импактов, §10.1); свечение
  избирательное по MRT-маске, не пороговое; палитра — frost из
  `src/skills/registry.js`, один источник на сервер и на экран.

  Адрес: ?skill=wave|shield|rain&t=1.2 — заморозить фазу (&broken=1 — вариант
  щита «разбили»); ?bloom=0 ?webgl=1 ?dark=1 ?yaw ?pitch ?dist — как на /ice.
  Клавиши 1/2/3 кастуют вручную; без них стенд крутит цикл сам.
-->

<script type="importmap">
{ "imports": {
  "three": "/vendor/three.webgpu.js",
  "three/webgpu": "/vendor/three.webgpu.js",
  "three/tsl": "/vendor/three.tsl.js",

<script type="module">
import * as THREE from 'three';
import * as TSLNS from 'three/tsl';
import {
  float, vec3, vec4, uv, uniform, attribute, positionLocal, positionWorld,
  normalView, normalWorld, positionViewDirection, cameraProjectionMatrix, modelViewMatrix,
  mix, smoothstep, pow, abs as tabs, length, dot, oneMinus, max as tmax,
  mx_noise_float, mx_fractal_noise_float, mrt, output as tslOutput, pass,
} from 'three/tsl';

const params = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
const fail = (m) => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; console.error(m); };
const num = (k, d) => { const v = parseFloat(params.get(k) ?? ''); return Number.isFinite(v) ? v : d; };

/* Палитра элемента frost — дословно из `src/skills/registry.js`. */
const FROST = ['#e8fbff', '#7fe3e0', '#1f8f9d'].map((h) => new THREE.Color(h));
const [C_RIM, C_MID, C_DEEP] = FROST;
const nRIM = vec3(C_RIM.r, C_RIM.g, C_RIM.b);
const nMID = vec3(C_MID.r, C_MID.g, C_MID.b);
const nDEEP = vec3(C_DEEP.r, C_DEEP.g, C_DEEP.b);

// ───────────────────────────────────────────────────────────────────────────
// сцена, рендерер, свечение, свет — как в арене (§10.1) и на стенде /ice
// ───────────────────────────────────────────────────────────────────────────
const DARK_FLOOR = params.get('dark') === '1';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f14);
scene.fog = new THREE.Fog(0x101620, 42, 120);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 400);

let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: params.get('webgl') === '1' });
  await renderer.init();
} catch (e) {
  fail(`WebGPU unavailable (${e.message}) — falling back to WebGL2`);
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: true });
  await renderer.init();
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

let post = null;
let glowOn = false;
const wantBloom = params.get('bloom') !== '0';
try {
  if (!wantBloom) throw new Error('выключено параметром ?bloom=0');
  const { bloom } = await import('three/addons/tsl/display/BloomNode.js');
  const scenePass = pass(scene, camera);
  scenePass.setMRT(mrt({ output: tslOutput, bloomIntensity: float(0) }));
  const colour = scenePass.getTextureNode('output');
  const glow = scenePass.getTextureNode('bloomIntensity');
  post = new THREE.PostProcessing(renderer);
  post.outputNode = colour.add(bloom(colour.mul(glow), 0.42, 0.8, 0));
  glowOn = true;
} catch (e) {
  if (wantBloom) fail(`bloom unavailable (${e.message}) — рисуем без постобработки`);
}

/* `amount` — узел-МАСКА, не число. Помеченный целиком материал на белом полу
   уходит в ровный белый и стирает элемент — замерено на /ice. */
function markGlow(material, amount) {
  if (!glowOn) return material;
  const node = typeof amount === 'number' ? float(amount) : amount;
  try { material.mrtNode = mrt({ bloomIntensity: node }); } catch { /* без MRT */ }
  return material;
}

scene.add(new THREE.HemisphereLight(0xdfe6f2, 0x2a2f38, 1.4));
const key = new THREE.DirectionalLight(0xfff4e0, 2.5);
key.position.set(16, 26, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -24; key.shadow.camera.right = 24;
key.shadow.camera.top = 24; key.shadow.camera.bottom = -24;
key.shadow.camera.near = 1; key.shadow.camera.far = 80;
key.shadow.bias = -0.0011;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 0.85);
rim.position.set(-16, 10, -14);
scene.add(rim);

/* Пул вспышек — ДВА, заведённых сразу: смена ЧИСЛА источников пересобирает
   конвейер материалов у WebGPURenderer, а погашенный источник стоит столько
   же, сколько горящий (замер в `src/viewer/vfx.js`). */
const LIGHTS = [0, 0].map(() => {
  const l = new THREE.PointLight(0x9fe8ff, 0, 12, 2);
  l.userData.until = 0; l.userData.peak = 0;
  scene.add(l);
  return l;
});
let lightHead = 0;
function flashLight(x, y, z, secs, peak) {
  const l = LIGHTS[lightHead]; lightHead = (lightHead + 1) % LIGHTS.length;
  l.position.set(x, y, z);
  l.userData.until = TIME.value + secs;
  l.userData.peak = peak; l.userData.secs = secs;
}
function tickLights() {
  for (const l of LIGHTS) {
    const left = l.userData.until - TIME.value;
    l.intensity = left > 0 ? Math.pow(left / l.userData.secs, 1.6) * l.userData.peak : 0;
  }
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(19, 96),
  new THREE.MeshStandardMaterial({
    color: DARK_FLOOR ? 0x151a22 : 0xf2f1ec, roughness: 0.86, metalness: 0.04,
  }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

{ /* Граница мира — телеграф, ей светиться можно. */
  const edge = new THREE.Mesh(
    new THREE.RingGeometry(18.9, 19.2, 128),
    markGlow(new THREE.MeshBasicNodeMaterial({ color: 0x2e6f7d, transparent: true, opacity: 0.85 }), 0.7),
  );
  edge.rotation.x = -Math.PI / 2;
  edge.position.y = 0.012;
  scene.add(edge);
}

// ───────────────────────────────────────────────────────────────────────────
// ГЕОМЕТРИЯ КВАРЦА — порт `makeCrystalGeometry` из GeometryPainterThreeJS
//
// Отличие от конуса со стенда /ice принципиальное: там кольца дрожали каждое
// своё, и грани закручивались винтом. Здесь дрожит КОЛОННА — угол и радиус
// выбираются один раз на грань, низ и верх делят их, и ребро остаётся прямым
// сверху донизу. Плоские грани на неиндексированной геометрии — это и есть
// то, что читается как «кристалл». Нормализовано в высоту 1, основание в y=0.
// ───────────────────────────────────────────────────────────────────────────
const mulberry = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

function quartzGeometry(rnd) {
  const sides = 6;
  const baseR = 0.16 + rnd() * 0.1;
  const shaftH = 0.55 + rnd() * 0.2;     // где начинается завершение
  const taper = 0.78 + rnd() * 0.16;     // ствол чуть сужается к вершине
  const apex = new THREE.Vector3((rnd() - 0.5) * 0.14, 1, (rnd() - 0.5) * 0.14);

  const angles = [], radii = [];
  for (let i = 0; i < sides; i++) {
    angles.push(((i + (rnd() - 0.5) * 0.34) / sides) * Math.PI * 2);
    radii.push(baseR * (0.8 + rnd() * 0.4));
  }

  const lower = [], upper = [];
  for (let i = 0; i < sides; i++) {
    const c = Math.cos(angles[i]), s = Math.sin(angles[i]);
    lower.push(new THREE.Vector3(c * radii[i], 0, s * radii[i]));
    upper.push(new THREE.Vector3(c * radii[i] * taper, shaftH, s * radii[i] * taper));
  }

  const positions = [];
  const push = (a, b, c) => positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  /* Крошечная вершина ПОД основанием закрывает наклонённые кристаллы снизу. */
  const bottom = new THREE.Vector3(0, -0.02, 0);
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    push(lower[i], upper[i], upper[j]);
    push(lower[i], upper[j], lower[j]);
    push(upper[i], apex, upper[j]);
    push(lower[j], bottom, lower[i]);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  return geo;
}

const VARIANTS = 3;
const variantGeos = (() => {
  const rnd = mulberry(0xc0ffee);
  return Array.from({ length: VARIANTS }, () => quartzGeometry(rnd));
})();

const BACK_C1 = 1.70158, BACK_C3 = BACK_C1 + 1;
const easeOutBack = (x) => 1 + BACK_C3 * Math.pow(x - 1, 3) + BACK_C1 * Math.pow(x - 1, 2);
const clamp01 = (x) => Math.min(1, Math.max(0, x));

// ───────────────────────────────────────────────────────────────────────────
// МАТЕРИАЛ ЛЬДА — со стенда /ice, фабрикой: у каждого скилла свои фазы
// ───────────────────────────────────────────────────────────────────────────
const TIME = uniform(0);

function iceMaterial(uGrow, uFade) {
  const m = new THREE.MeshStandardNodeMaterial({ metalness: 0.05, roughness: 0.22 });

  const h = positionLocal.y.saturate();
  const fres = oneMinus(tabs(dot(normalView, positionViewDirection))).pow(2.1).saturate();
  const veins = mx_fractal_noise_float(positionWorld.mul(2.9), 3, 2.0, 0.5, 1).mul(0.5).add(0.5);
  const cracks = smoothstep(0.46, 0.54, veins);
  const rime = oneMinus(smoothstep(0.0, 0.28, h));

  const body = mix(nDEEP, nMID, h.pow(0.62));
  const withVeins = mix(body, nRIM, cracks.mul(0.28));
  const withRime = mix(withVeins, nRIM.mul(0.86), rime.mul(0.4));
  /* 0.42 подобрано на /ice против БЕЛОГО пола: перетянутый френель стирает
     кристалл в белый. Тёмный пол прощает всё, белый не прощает ничего. */
  const tinted = mix(withRime, nRIM, fres.mul(0.42));
  m.colorNode = tinted.mul(h.mul(0.3).add(0.7));

  const flare = fres.pow(1.6).mul(0.85).add(h.pow(4.0).mul(0.4)).mul(uGrow.mul(0.5).add(0.5));
  m.emissiveNode = nRIM.mul(flare.mul(uFade).mul(0.9));
  /* В bloom уходит ТА ЖЕ маска, что светится, — иначе белая клякса. */
  return markGlow(m, flare.mul(uFade).saturate());
}

// ───────────────────────────────────────────────────────────────────────────
// МОРОЗНАЯ ПЫЛЬ — инстансированный пул, интеграция аналитическая (как /ice)
// ───────────────────────────────────────────────────────────────────────────
const MAX_MOTES = 520;

class Motes {
  constructor(blending, tint) {
    const quad = new THREE.PlaneGeometry(1, 1);
    const geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.attributes.position = quad.attributes.position;
    geo.attributes.uv = quad.attributes.uv;
    geo.instanceCount = MAX_MOTES;

    const f = (n) => new THREE.InstancedBufferAttribute(new Float32Array(MAX_MOTES * n), n);
    this.aPos = f(3); this.aVel = f(3); this.aLife = f(3);
    geo.setAttribute('aPos', this.aPos);
    geo.setAttribute('aVel', this.aVel);
    geo.setAttribute('aLife', this.aLife);
    for (let i = 0; i < MAX_MOTES; i++) this.aLife.array[i * 3 + 1] = -1;

    const aPos = attribute('aPos', 'vec3');
    const aVel = attribute('aVel', 'vec3');
    const aLife = attribute('aLife', 'vec3');

    const age = TIME.sub(aLife.x);
    const t01 = age.div(aLife.y).saturate();
    const alive = smoothstep(0.0, 0.02, age).mul(oneMinus(smoothstep(0.75, 1.0, t01)));
    const drag = oneMinus(pow(oneMinus(t01), 2.0));
    const world = aPos.add(aVel.mul(drag).mul(aLife.y))
      .add(vec3(0, float(-1.1).mul(age).mul(age).mul(0.5), 0));
    const size = aLife.z.mul(oneMinus(t01).pow(0.45)).mul(smoothstep(0.0, 0.1, t01).mul(0.5).add(0.5));

    const mat = new THREE.MeshBasicNodeMaterial({
      transparent: true, depthWrite: false, blending, side: THREE.DoubleSide,
    });
    mat.vertexNode = cameraProjectionMatrix.mul(
      modelViewMatrix.mul(vec4(world, 1)).add(vec4(positionLocal.xy.mul(size), 0, 0)),
    );
    const d = length(uv().sub(0.5)).mul(2);
    const disc = oneMinus(smoothstep(0.35, 1.0, d));
    mat.colorNode = vec3(tint.r, tint.g, tint.b);
    mat.opacityNode = disc.mul(alive).mul(0.85);
    markGlow(mat, blending === THREE.AdditiveBlending ? disc.mul(alive) : 0);

    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 4;
    this.head = 0;
    scene.add(this.mesh);
  }

  emit(n, fn) {
    for (let k = 0; k < n; k++) {
      const i = this.head; this.head = (this.head + 1) % MAX_MOTES;
      const { pos, vel, life, size } = fn(k);
      this.aPos.array.set(pos, i * 3);
      this.aVel.array.set(vel, i * 3);
      this.aLife.array[i * 3] = TIME.value;
      this.aLife.array[i * 3 + 1] = life;
      this.aLife.array[i * 3 + 2] = size;
    }
    this.aPos.needsUpdate = this.aVel.needsUpdate = this.aLife.needsUpdate = true;
  }
}

const moteBody = new Motes(THREE.NormalBlending, C_DEEP);
const moteGlow = new Motes(THREE.AdditiveBlending, C_RIM);

/* Всплеск в точке: оба пула сразу, тело гуще свечения. */
function burst(x, y, z, n, speed = 3.5) {
  const spawn = () => {
    const a = Math.random() * Math.PI * 2;
    const up = 0.6 + Math.random() * 2.4;
    return {
      pos: [x + (Math.random() - 0.5) * 0.5, y + Math.random() * 0.4, z + (Math.random() - 0.5) * 0.5],
      vel: [Math.cos(a) * speed * (0.4 + Math.random() * 0.8), up, Math.sin(a) * speed * (0.4 + Math.random() * 0.8)],
      life: 0.5 + Math.random() * 0.55,
      size: 0.07 + Math.random() * 0.16,
    };
  };
  moteBody.emit(n, spawn);
  moteGlow.emit(Math.ceil(n * 0.6), spawn);
}

// ───────────────────────────────────────────────────────────────────────────
// СУЩЕСТВО — НАСТОЯЩЕЕ ТЕЛО ПРОЕКТА, НЕ МАКЕТ
//
// Грузится так же, как в макете арены: исходник из `/bodies/`, сборка через
// `build(THREE, TSL)`, масштаб от радиуса бойца, посадка на пол по низу
// геометрии. Тело — матовая глина и не светится (§10.1); лёд — только то,
// что делает скилл.
// ───────────────────────────────────────────────────────────────────────────
const creature = new THREE.Group();
scene.add(creature);
/* Радиус как в макете арены: 1.25 sim × 1.5 читаемости. */
const FIGHTER_R = 1.25 * 1.5;
let bodyRoot = null, bodyHeight = 3, bodyLength = 3.5;
{
  const src = await (await fetch('/bodies/gorilla.js')).text();
  const make = new Function('THREE', 'TSL', `${src}\n;return build(THREE, TSL);`);
  bodyRoot = make(THREE, TSLNS);
  bodyRoot.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const raw = new THREE.Box3().setFromObject(bodyRoot);
  const size = new THREE.Vector3(); raw.getSize(size);
  bodyRoot.scale.setScalar((FIGHTER_R * 2) / (Math.max(size.x, size.z) || 1));
  bodyRoot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(bodyRoot);
  bodyRoot.position.y = -box.min.y;             // подошвы на пол, не в пол
  const s2 = new THREE.Vector3(); box.getSize(s2);
  bodyHeight = s2.y; bodyLength = Math.max(s2.x, s2.z);
  creature.add(bodyRoot);
}

/* Поворот к цели и толчок на касте — то, что делает существо УЧАСТНИКОМ
   каста, а не подставкой рядом с эффектом. Замаха руками нет: у боевого тела
   своя поза, и стенд её не трогает. */
/* Тело построено ЛИЦОМ В +Z (морда на z=+0.30) — поворот вокруг Y на θ
   переводит (0,0,1) в (sinθ, cosθ), отсюда atan2(dx, dz). */
let faceYaw = 0, faceTarget = 0;
let gestureAt = -9;
function faceToward(x, z) { faceTarget = Math.atan2(x - creature.position.x, z - creature.position.z); }
function gesture() { gestureAt = TIME.value; }

function poseCreature(now, dt) {
  let d = faceTarget - faceYaw;
  d = Math.atan2(Math.sin(d), Math.cos(d));  // кратчайшая дуга
  faceYaw += d * Math.min(1, dt * 7);
  creature.rotation.y = faceYaw;

  const g = clamp01((now - gestureAt) / 0.5);
  creature.position.y = Math.sin(g * Math.PI) * 0.22;   // толчок от земли
  bodyRoot?.userData.update?.(now, dt);                 // штатный айдл тела
}

// ───────────────────────────────────────────────────────────────────────────
// РАСКЛАДКА СЦЕНЫ
// ───────────────────────────────────────────────────────────────────────────
/* Существо в центре, волна бьёт в одну сторону, дождь — в другую: три скилла
   должны читаться одним кадром, это и есть предмет стенда. */
/* Начало волны — за мордой тела, не из его центра: горилла длиной под четыре
   метра, и разлом, вылезающий из середины спины, читается как баг. */
const WAVE_FROM = new THREE.Vector3(2.4, 0, -0.7);
const WAVE_TO = new THREE.Vector3(13.0, 0, -3.4);
/* Стартовая стойка — мордой к цели волны, а не в мировой +Z. */
faceYaw = faceTarget = Math.atan2(WAVE_TO.x, WAVE_TO.z);
creature.rotation.y = faceYaw;
const RAIN_AT = new THREE.Vector3(6.4, 0, 6.4);
const RAIN_R = 3.0;

// ───────────────────────────────────────────────────────────────────────────
// СКИЛЛ 1 · ВОЛНА — разлом от существа, стена клинков в конце (стенд /ice)
// ───────────────────────────────────────────────────────────────────────────
const wave = (() => {
  const uFront = uniform(0), uFade = uniform(0), uGrow = uniform(0);

  const DIR = WAVE_TO.clone().sub(WAVE_FROM); const LEN = DIR.length(); DIR.normalize();
  const SIDE = new THREE.Vector3(-DIR.z, 0, DIR.x);

  /* Плита-наледь: кладётся в XZ на уровне геометрии, доворот один — вокруг Y. */
  const slabGeo = new THREE.PlaneGeometry(1, 1);
  slabGeo.rotateX(-Math.PI / 2);
  const slabMat = (() => {
    const m = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide });
    const p = uv().mul(2).sub(1);
    const along = p.x.mul(0.5).add(0.5);
    const across = tabs(p.y);
    const halfW = float(0.16).add(along.pow(1.35).mul(0.78));
    const wob = mx_fractal_noise_float(vec3(along.mul(7.0), p.y.mul(3.0), 0.0), 3, 2.0, 0.5, 1).mul(0.13);
    const edge = oneMinus(smoothstep(halfW.add(wob).sub(0.1), halfW.add(wob), across));
    const front = oneMinus(smoothstep(uFront, uFront.add(0.09), along));
    const n1 = mx_fractal_noise_float(vec3(along.mul(3.6), p.y.mul(4.6), 11.0), 4, 2.0, 0.55, 1);
    const ridge = oneMinus(smoothstep(0.0, 0.09, tabs(n1)));
    const n2 = mx_fractal_noise_float(vec3(along.mul(9.5), p.y.mul(11.0), 3.0), 3, 2.0, 0.5, 1);
    const hair = oneMinus(smoothstep(0.0, 0.035, tabs(n2))).mul(0.62);
    const crack = tmax(ridge, hair).mul(edge).mul(front);
    const grain = mx_fractal_noise_float(vec3(along.mul(7.5), p.y.mul(7.5), 21.0), 3, 2.0, 0.5, 1).mul(0.5).add(0.5);
    const ice = edge.mul(front).mul(grain.mul(0.5).add(0.5)).mul(oneMinus(along).mul(0.35).add(0.65));
    /* Трещина на белом полу — ТЁМНАЯ: разлом — это щель, отсутствие света.
       Горячей остаётся только середина скола (вывод стенда /ice). */
    const gap = vec3(0.03, 0.16, 0.20);
    const core = oneMinus(smoothstep(0.55, 1.0, crack));
    const hot = smoothstep(0.82, 1.0, crack);
    const slabIce = mix(nDEEP, nMID, grain.mul(0.55));
    m.colorNode = mix(mix(slabIce, gap, oneMinus(core).mul(0.92)), nRIM, hot.mul(0.75));
    m.opacityNode = ice.mul(0.7).add(crack.mul(0.95)).mul(uFade).saturate();
    return markGlow(m, hot.mul(uFade).saturate());
  })();
  const slab = new THREE.Mesh(slabGeo, slabMat);
  slab.scale.set(LEN * 1.06, 1, 7.2);
  slab.position.copy(WAVE_FROM).addScaledVector(DIR, LEN / 2).setY(0.02);
  slab.rotation.y = Math.atan2(-DIR.z, DIR.x);
  slab.renderOrder = 2;
  scene.add(slab);

  /* Поле кристаллов: ствол + стена. Инстансы хранят параметры, матрицы
     пересобираются каждый кадр — приём GeometryPainter, живая фаза. */
  const items = [];
  {
    const rnd = mulberry(20260901);
    for (let i = 0; i < 170; i++) {
      const t = Math.pow(rnd(), 1.55);
      const lateral = (rnd() - 0.5) * 2 * (0.45 + Math.pow(t, 1.3) * 2.2);
      const p = WAVE_FROM.clone().addScaledVector(DIR, t * LEN).addScaledVector(SIDE, lateral);
      items.push({
        v: i % VARIANTS, p,
        yaw: rnd() * Math.PI * 2,
        tiltX: (rnd() - 0.5) * 0.3,
        tiltZ: (0.12 + rnd() * 0.4) * Math.sign(lateral || 1) * (0.4 + t),
        h: (0.55 + rnd() * 1.5) * (1.15 - t * 0.35),
        w: 0.7 + rnd() * 0.7,
        born: t * 0.92 + rnd() * 0.05,
      });
    }
    for (let i = 0; i < 70; i++) {
      const u = (i / 69 - 0.5) * 2;
      const p = WAVE_TO.clone()
        .addScaledVector(SIDE, u * 3.4 + (rnd() - 0.5) * 0.5)
        .addScaledVector(DIR, -Math.abs(u) * 1.5 + (rnd() - 0.5) * 0.7);
      items.push({
        v: i % VARIANTS, p,
        yaw: rnd() * Math.PI * 2,
        tiltX: (rnd() - 0.5) * 0.22 - 0.16,
        tiltZ: u * 0.55 + (rnd() - 0.5) * 0.2,
        h: 1.5 + rnd() * 2.4 * (1 - Math.abs(u) * 0.45),
        w: 0.9 + rnd() * 0.8,
        born: 0.9 + rnd() * 0.1,
      });
    }
  }
  const buckets = Array.from({ length: VARIANTS }, () => []);
  items.forEach((c) => buckets[c.v].push(c));
  const mat = iceMaterial(uGrow, uFade);
  const meshes = buckets.map((list, v) => {
    const m = new THREE.InstancedMesh(variantGeos[v], mat, list.length);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.castShadow = true;
    m.frustumCulled = false;
    scene.add(m);
    return m;
  });

  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
    _s = new THREE.Vector3(), _p = new THREE.Vector3();

  function layout(phase, melt) {
    for (let v = 0; v < VARIANTS; v++) {
      const list = buckets[v];
      for (let i = 0; i < list.length; i++) {
        const c = list[i];
        const a = clamp01((phase - c.born) / 0.22);
        const g = (a <= 0 ? 0 : easeOutBack(a)) * melt;
        _e.set(c.tiltX, c.yaw, c.tiltZ);
        _q.setFromEuler(_e);
        _s.set(c.w * g, Math.max(0.001, c.h * g), c.w * g);
        _p.set(c.p.x, -0.12 * c.h * (1 - a), c.p.z);
        _m.compose(_p, _q, _s);
        meshes[v].setMatrixAt(i, _m);
      }
      meshes[v].instanceMatrix.needsUpdate = true;
    }
  }
  layout(0, 1);

  const T_TRAVEL = 0.62, T_HOLD = 1.05, T_FADE = 0.95;
  const DUR = T_TRAVEL + T_HOLD + T_FADE;
  let castAt = -99, impactDone = true;

  return {
    name: 'волна', dur: DUR,
    begin() {
      castAt = TIME.value; impactDone = false;
      faceToward(WAVE_TO.x, WAVE_TO.z);
      gesture();
    },
    pin(t) { this.begin(); castAt = TIME.value - t; if (t >= T_TRAVEL) impactDone = true; },
    hold(t) { castAt = TIME.value - t; },
    update() {
      const t = TIME.value - castAt;
      if (t > DUR) { uFade.value = 0; layout(1, 0); return false; }

      let front, growV, fade;
      if (t < T_TRAVEL) { front = t / T_TRAVEL; growV = 1; fade = 1; }
      else if (t < T_TRAVEL + T_HOLD) { front = 1; growV = Math.max(0, 1 - (t - T_TRAVEL) / 0.4); fade = 1; }
      else { front = 1; growV = 0; fade = Math.max(0, 1 - (t - T_TRAVEL - T_HOLD) / T_FADE); }
      uFront.value = front; uGrow.value = growV; uFade.value = fade;
      /* Тает — оседая: масштаб уходит с фейдом, но не в ноль резко. */
      layout(Math.min(1, front), 0.25 + fade * 0.75);

      if (t < T_TRAVEL) {
        const p = WAVE_FROM.clone().addScaledVector(DIR, front * LEN);
        const spawn = () => {
          const s = (Math.random() - 0.5) * 2 * (0.5 + front * 2.2);
          const o = p.clone().addScaledVector(SIDE, s);
          return {
            pos: [o.x, 0.1 + Math.random() * 0.35, o.z],
            vel: [(Math.random() - 0.5) * 1.4 + DIR.x * 1.6, 0.9 + Math.random() * 1.7,
                  (Math.random() - 0.5) * 1.4 + DIR.z * 1.6],
            life: 0.55 + Math.random() * 0.6,
            size: 0.07 + Math.random() * 0.13,
          };
        };
        moteBody.emit(3, spawn);
        moteGlow.emit(2, spawn);
      }
      if (!impactDone && t >= T_TRAVEL) {
        impactDone = true;
        flashLight(WAVE_TO.x, 1.6, WAVE_TO.z, 0.26, 34);
        burst(WAVE_TO.x, 0.4, WAVE_TO.z, 46, 4.5);
      }
      return true;
    },
    stage() {
      const t = TIME.value - castAt;
      return t < T_TRAVEL ? 'разлом идёт' : t < T_TRAVEL + T_HOLD ? 'стена стоит' : 'тает';
    },
  };
})();

// ───────────────────────────────────────────────────────────────────────────
// СКИЛЛ 2 · ЩИТ — ЛЕДЯНОЙ КУПОЛ
//
// Сфера вокруг существа, как защитный купол: тело видно СКВОЗЬ — вся
// плотность на канте (френель) и в морозных прожилках, середина почти
// прозрачна. Купол уходит нижней третью в пол, на полу — кольцо контакта.
//
// Два конца, и оба показываются. Щит БЬЮТ: каждый удар — волна по поверхности
// от точки попадания и трещины, раскрывающиеся от удара к удару; третий удар
// разносит купол крошкой. Или щит ДОЖИВАЕТ: доля секунд вышла — купол тает.
// Циклы демо чередуют варианты; в адресе — &broken=1.
// ───────────────────────────────────────────────────────────────────────────
const shield = (() => {
  const uFade = uniform(0);        // общая плотность купола
  const uCrack = uniform(0);       // сколько трещин раскрыто, 0..1
  const uHitDir = uniform(new THREE.Vector3(0, 1, 0)); // куда пришёлся удар
  const uHitAge = uniform(1);      // возраст волны удара, 0..1

  /* Радиус от настоящего тела, не констан­той: купол обязан накрывать бойца
     с запасом, каким бы тело ни было. */
  const R = bodyLength * 0.62 + 0.9;
  const CY = bodyHeight * 0.42;
  const DUR_LIFE = 6.0, MELT = 0.7, HITS_AT = [2.0, 3.0, 3.9];

  const mat = (() => {
    const m = new THREE.MeshBasicNodeMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
    });
    const n = normalWorld;
    const fres = oneMinus(tabs(dot(normalView, positionViewDirection))).pow(2.0).saturate();

    /* Прожилки ползут: купол — не стекло, а живой намороженный слой. */
    const drift = vec3(0, TIME.mul(0.05), TIME.mul(0.03));
    const v1 = mx_fractal_noise_float(n.mul(3.0).add(drift), 3, 2.0, 0.5, 1);
    const vein = oneMinus(smoothstep(0.0, 0.07, tabs(v1)));

    /* Трещины раскрываются ДЫРЧАТО по второму шуму: каждый удар поднимает
       uCrack, и сеть прорастает от случайных очагов, а не проявляется
       простынёй. */
    const cellN = mx_noise_float(n.mul(1.6).add(vec3(31))).mul(0.5).add(0.5);
    const reveal = smoothstep(cellN.sub(0.12), cellN, uCrack);
    const c1 = mx_fractal_noise_float(n.mul(5.0).add(vec3(13)), 4, 2.0, 0.55, 1);
    const crackLine = oneMinus(smoothstep(0.0, 0.05, tabs(c1))).mul(reveal);

    /* Волна от удара: хордовое расстояние до точки попадания вместо дуги —
       на сфере единичного радиуса это та же геометрия без арккосинуса. */
    const dd = length(n.sub(uHitDir));
    const ring = smoothstep(0.14, 0.0, tabs(dd.sub(uHitAge.mul(2.0)))).mul(oneMinus(uHitAge));

    /* Трещины ТЁМНЫЕ. Против белого пола светлая трещина на светлом куполе
       невидима — тот же вывод, что с разломом на полу (/ice): трещина — это
       щель, отсутствие света. Светятся только кант, прожилки и волна удара. */
    const gap = vec3(0.03, 0.16, 0.20);
    const base = mix(mix(nDEEP, nMID, fres.mul(0.8).add(0.1)), gap, crackLine.mul(0.85));
    m.colorNode = mix(base, nRIM, vein.mul(0.35).add(ring).saturate());
    m.opacityNode = fres.pow(1.2).mul(0.5).add(0.06)
      .add(vein.mul(0.2)).add(crackLine.mul(0.6)).add(ring.mul(0.65))
      .mul(uFade).saturate();
    return markGlow(m, fres.mul(0.3).add(vein.mul(0.35)).add(ring).mul(uFade).saturate());
  })();

  const dome = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), mat);
  dome.position.set(0, CY, 0);
  dome.scale.setScalar(0.001);
  dome.renderOrder = 3;
  dome.frustumCulled = false;
  scene.add(dome);

  /* Кольцо контакта: где сфера пересекает пол. Радиус — сечение сферы
     плоскостью y=0, а не декоративная константа. */
  const RR = Math.sqrt(Math.max(0.2, R * R - CY * CY));
  const ringMat = markGlow(new THREE.MeshBasicNodeMaterial({
    color: C_MID, transparent: true, opacity: 0, depthWrite: false,
  }), 0.55);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1.0, 64), ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  ring.scale.setScalar(0.001);
  scene.add(ring);

  let castAt = 1e9, running = false, breaking = false;
  let hits = [], hitStart = -9, ended = false, endAt = 0, shattered = false;

  return {
    name: 'щит', dur: DUR_LIFE + MELT + 0.2,
    begin(brk) {
      castAt = TIME.value; running = true; ended = false; shattered = false;
      breaking = !!brk;
      uCrack.value = 0; uHitAge.value = 1; hitStart = -9;
      hits = breaking ? HITS_AT.map((at) => ({ at })) : [];
      gesture();
      burst(creature.position.x, CY, creature.position.z, 26, 2.2);
    },
    pin(t, brk) { this.begin(brk); castAt = TIME.value - t; },
    hold(t) { castAt = TIME.value - t; },
    update() {
      if (!running) return false;
      const now = TIME.value;
      const t = now - castAt;

      const born = clamp01(t / 0.4);
      const grow = born <= 0 ? 0 : easeOutBack(born);
      const melt = ended && !shattered ? Math.max(0, 1 - (now - endAt) / MELT) : 1;
      const gone = shattered ? Math.max(0, 1 - (now - endAt) / 0.14) : 1;
      uFade.value = born * melt * gone;
      ringMat.opacity = 0.55 * born * melt * gone;

      dome.position.set(creature.position.x, CY, creature.position.z);
      /* Разбитый купол не сжимается, а лопается: короткий распух и в ноль. */
      const pop = shattered ? 1 + (1 - gone) * 0.1 : 1;
      dome.scale.setScalar(Math.max(0.001, R * grow * pop * (shattered ? gone : 1)));
      ring.position.set(creature.position.x, 0.03, creature.position.z);
      ring.scale.setScalar(Math.max(0.001, RR * grow * melt * gone));

      if (hitStart >= 0) uHitAge.value = clamp01((now - hitStart) / 0.45);

      for (const h of hits) {
        if (t >= h.at && !h.done) {
          h.done = true;
          /* Точка удара — верхняя полусфера, случайное направление. */
          const a = Math.random() * Math.PI * 2;
          const up = Math.random() * 0.7;
          const dir = new THREE.Vector3(Math.cos(a), up, Math.sin(a)).normalize();
          uHitDir.value.copy(dir);
          hitStart = now;
          uCrack.value = Math.min(1, uCrack.value + 0.36);
          const px = dome.position.x + dir.x * R, py = CY + dir.y * R, pz = dome.position.z + dir.z * R;
          burst(px, py, pz, 30, 3.4);
          flashLight(px, py, pz, 0.22, 26);
          /* Третий удар — конец: купол лопается. */
          if (hits.every((x) => x.done)) {
            ended = true; shattered = true; endAt = now + 0.12;
          }
        }
      }

      /* Лопнул: крошка по всей поверхности, один раз. */
      if (shattered && !this._burstDone && now >= endAt) {
        this._burstDone = true;
        const spawn = () => {
          const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2;
          const rxz = Math.sqrt(1 - u * u);
          const d = [rxz * Math.cos(a), Math.abs(u) * 0.8 + 0.2, rxz * Math.sin(a)];
          return {
            pos: [dome.position.x + d[0] * R, Math.max(0.15, CY + (u * 0.8) * R), dome.position.z + d[2] * R],
            vel: [d[0] * 4.2, d[1] * 2.6, d[2] * 4.2],
            life: 0.6 + Math.random() * 0.6,
            size: 0.08 + Math.random() * 0.16,
          };
        };
        moteBody.emit(60, spawn);
        moteGlow.emit(40, spawn);
        flashLight(dome.position.x, CY, dome.position.z, 0.3, 40);
      }

      if (!ended && t >= DUR_LIFE) { ended = true; endAt = now; }
      if (ended && now - endAt > (shattered ? 0.2 : MELT)) {
        running = false; this._burstDone = false;
        uFade.value = 0;
        dome.scale.setScalar(0.001);
        ring.scale.setScalar(0.001);
        return false;
      }

      /* Морозная взвесь сползает по куполу, пока он жив. */
      if (!ended && Math.random() < 0.45) {
        const a = Math.random() * Math.PI * 2;
        moteGlow.emit(1, () => ({
          pos: [dome.position.x + Math.cos(a) * RR * 0.96, 0.3 + Math.random() * 0.8,
                dome.position.z + Math.sin(a) * RR * 0.96],
          vel: [-Math.sin(a) * 1.2, 0.2, Math.cos(a) * 1.2],
          life: 0.7 + Math.random() * 0.5,
          size: 0.05 + Math.random() * 0.08,
        }));
      }
      return true;
    },
    stage() {
      if (shattered) return 'разбит';
      if (ended) return 'тает';
      if (uCrack.value > 0) return 'трещит';
      return breaking ? 'под ударами' : 'держится';
    },
  };
})();

// ───────────────────────────────────────────────────────────────────────────
// СКИЛЛ 3 · ДОЖДЬ — телеграф зоны, осыпание сосулек, наросты в местах ударов
// ───────────────────────────────────────────────────────────────────────────
const rain = (() => {
  const uTele = uniform(0), uReveal = uniform(0), uFade = uniform(0), uGrow = uniform(0);
  const N_DROPS = 26;
  const T_TELE = 0.8, T_FALL = 2.0, T_HOLD = 0.9, T_FADE = 0.9;
  const DUR = T_TELE + T_FALL + T_HOLD + T_FADE;

  /* Телеграф. В бою телеграфы красные — они откалиброваны против белого пола
     как инфраструктура уклонения. Здесь витрина СВОЕГО каста, и телеграф
     морозный; в арене этот материал обязан взять цвет из read-kit. */
  const teleGeo = new THREE.CircleGeometry(RAIN_R, 64);
  teleGeo.rotateX(-Math.PI / 2);
  const teleMat = (() => {
    const m = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false });
    const r = length(uv().mul(2).sub(1));
    const ringM = smoothstep(0.86, 0.9, r).mul(oneMinus(smoothstep(0.97, 1.0, r)));
    const pulse = TIME.mul(5.0).sin().mul(0.25).add(0.75);
    const fill = oneMinus(smoothstep(0.0, 1.0, r)).mul(0.14).mul(pulse);
    m.colorNode = mix(nMID, nRIM, ringM);
    m.opacityNode = ringM.mul(0.9).add(fill).mul(uTele);
    return markGlow(m, ringM.mul(uTele));
  })();
  const tele = new THREE.Mesh(teleGeo, teleMat);
  tele.position.copy(RAIN_AT).setY(0.025);
  scene.add(tele);

  /* Наледь зоны: проявляется дырчато по шуму — растёт от ударов, а не
     включается простынёй. Тот же тёмный разлом, что у волны. */
  const decalGeo = new THREE.CircleGeometry(RAIN_R * 1.08, 64);
  decalGeo.rotateX(-Math.PI / 2);
  const decalMat = (() => {
    const m = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false });
    const p = uv().mul(2).sub(1);
    const r = length(p);
    const edge = oneMinus(smoothstep(0.86, 1.0, r));
    const grain = mx_fractal_noise_float(vec3(p.mul(5.0), 31.0), 3, 2.0, 0.5, 1).mul(0.5).add(0.5);
    const show = smoothstep(grain.sub(0.12), grain, uReveal);
    const n1 = mx_fractal_noise_float(vec3(p.mul(3.2), 17.0), 4, 2.0, 0.55, 1);
    const crack = oneMinus(smoothstep(0.0, 0.08, tabs(n1))).mul(edge).mul(show);
    const gap = vec3(0.03, 0.16, 0.20);
    const hot = smoothstep(0.8, 1.0, crack);
    const iceCol = mix(nDEEP, nMID, grain.mul(0.55));
    m.colorNode = mix(mix(iceCol, gap, crack.mul(0.9)), nRIM, hot.mul(0.7));
    m.opacityNode = edge.mul(show).mul(grain.mul(0.4).add(0.4)).add(crack.mul(0.5)).mul(uFade).saturate();
    return markGlow(m, hot.mul(uFade));
  })();
  const decal = new THREE.Mesh(decalGeo, decalMat);
  decal.position.copy(RAIN_AT).setY(0.02);
  decal.renderOrder = 2;
  scene.add(decal);

  /* Столб холодного света над зоной: читаемость. С камеры арены диск на полу
     мал, а «что-то сыплется откуда-то» — не читается вовсе; вертикальный
     столб отвечает на оба вопроса одним объёмом: ОТКУДА и КУДА. */
  const colGeo = new THREE.CylinderGeometry(RAIN_R * 0.96, RAIN_R * 0.96, 9.5, 48, 1, true);
  const colMat = (() => {
    const m = new THREE.MeshBasicNodeMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
    });
    const flow = mx_noise_float(vec3(uv().x.mul(9), uv().y.mul(2).sub(TIME.mul(0.35)), 0))
      .mul(0.3).add(0.7);
    m.colorNode = nMID;
    m.opacityNode = oneMinus(uv().y).pow(1.6).mul(0.12).mul(flow).mul(uTele.add(uGrow.mul(0.7)).saturate());
    return markGlow(m, oneMinus(uv().y).pow(2.0).mul(0.4).mul(uTele));
  })();
  const column = new THREE.Mesh(colGeo, colMat);
  column.position.copy(RAIN_AT).setY(4.75);
  column.renderOrder = 1;
  scene.add(column);

  const mat = iceMaterial(uGrow, uFade);

  /* Сосульки: узкий кварц остриём ВНИЗ. Поворот на π вокруг X переводит
     вершину (y=1) в y=−1: origin инстанса — это ХВОСТ, остриё ниже на длину. */
  const drops = new THREE.InstancedMesh(variantGeos[2], mat, N_DROPS);
  drops.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  drops.frustumCulled = false;
  scene.add(drops);

  /* Наросты в местах ударов. */
  const patches = new THREE.InstancedMesh(variantGeos[0], mat, N_DROPS);
  patches.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  patches.castShadow = true;
  patches.frustumCulled = false;
  scene.add(patches);

  const items = [];
  {
    const rnd = mulberry(0xf005ba11);
    for (let i = 0; i < N_DROPS; i++) {
      const a = rnd() * Math.PI * 2;
      const r = Math.sqrt(rnd()) * (RAIN_R - 0.4);
      items.push({
        x: RAIN_AT.x + Math.cos(a) * r, z: RAIN_AT.z + Math.sin(a) * r,
        delay: rnd() * (T_FALL - 0.5),
        len: 1.5 + rnd() * 1.0,
        fallDur: 0.36 + rnd() * 0.1,
        yaw: rnd() * Math.PI * 2,
        pw: 0.7 + rnd() * 0.7, ph: 0.8 + rnd() * 1.2,
        hitDone: false,
      });
    }
  }

  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
    _s = new THREE.Vector3(), _p = new THREE.Vector3();
  const H_START = 9;

  function layout(t, melt) {
    let revealed = 0;
    for (let i = 0; i < N_DROPS; i++) {
      const d = items[i];
      const ft = (t - T_TELE - d.delay) / d.fallDur;   // фаза падения 0..1

      /* Сосулька: видна только в полёте. Вершина летит от H_START к полу;
         лёгкое растяжение по ходу — штрих, а не палка. */
      const falling = ft > 0 && ft < 1;
      const stretch = falling ? 1.45 - 0.45 * ft : 1;
      const k = falling ? 1 : 0;
      const tipY = H_START * (1 - ft * ft);            // ускоряется вниз
      _e.set(Math.PI, d.yaw, 0.06);
      _q.setFromEuler(_e);
      _s.set(0.55 * k, Math.max(0.001, d.len * stretch * k), 0.55 * k);
      _p.set(d.x, tipY + d.len * stretch, d.z);
      _m.compose(_p, _q, _s);
      drops.setMatrixAt(i, _m);

      /* Нарост: рождается ударом, тает с зоной. */
      const pt = clamp01((t - T_TELE - d.delay - d.fallDur) / 0.3);
      const pk = (pt <= 0 ? 0 : easeOutBack(pt)) * melt;
      if (pt > 0) revealed++;
      _e.set(0, d.yaw, (i % 2 ? 1 : -1) * 0.24);
      _q.setFromEuler(_e);
      _s.set(d.pw * pk, Math.max(0.001, d.ph * pk), d.pw * pk);
      _p.set(d.x, 0, d.z);
      _m.compose(_p, _q, _s);
      patches.setMatrixAt(i, _m);
    }
    drops.instanceMatrix.needsUpdate = true;
    patches.instanceMatrix.needsUpdate = true;
    return revealed / N_DROPS;
  }
  layout(-1, 0);

  let castAt = -99, running = false;

  return {
    name: 'дождь', dur: DUR,
    begin() {
      castAt = TIME.value; running = true;
      items.forEach((d) => { d.hitDone = false; });
      faceToward(RAIN_AT.x, RAIN_AT.z);
      gesture();
    },
    pin(t) { this.begin(); castAt = TIME.value - t; items.forEach((d) => { if (t - T_TELE - d.delay - d.fallDur > 0) d.hitDone = true; }); },
    hold(t) { castAt = TIME.value - t; },
    update() {
      if (!running) return false;
      const t = TIME.value - castAt;
      if (t > DUR) { running = false; uFade.value = 0; uTele.value = 0; layout(t, 0); return false; }

      uTele.value = t < T_TELE ? clamp01(t / 0.25) :
        Math.max(0, 1 - (t - T_TELE) / 0.3);
      const fadePhase = clamp01((t - T_TELE - T_FALL - T_HOLD) / T_FADE);
      const melt = 1 - fadePhase;
      uFade.value = t < T_TELE ? 0 : melt;
      uGrow.value = t < T_TELE + T_FALL ? 1 : Math.max(0, 1 - (t - T_TELE - T_FALL) / 0.5);

      const revealed = layout(t, 0.25 + melt * 0.75);
      uReveal.value = revealed * (0.85 + 0.15 * melt);

      /* Удары: крошка + одна-две вспышки, не на каждый — пул света двойной,
         и вспышка на каждую сосульку слепила бы, а не объясняла. */
      for (const d of items) {
        if (!d.hitDone && t >= T_TELE + d.delay + d.fallDur) {
          d.hitDone = true;
          burst(d.x, 0.3, d.z, 16, 3.0);
          if (Math.random() < 0.3) flashLight(d.x, 1.0, d.z, 0.18, 18);
        }
      }

      /* Морозная взвесь у устья: там, где рождаются сосульки, что-то должно
         клубиться — иначе они появляются из пустоты. */
      if (t > T_TELE && t < T_TELE + T_FALL) {
        moteGlow.emit(2, () => {
          const a = Math.random() * Math.PI * 2;
          const r = Math.random() * (RAIN_R - 0.6);
          return {
            pos: [RAIN_AT.x + Math.cos(a) * r, 9.2 + Math.random() * 0.8, RAIN_AT.z + Math.sin(a) * r],
            vel: [-Math.sin(a) * 1.4, -0.4, Math.cos(a) * 1.4],
            life: 0.5 + Math.random() * 0.4,
            size: 0.09 + Math.random() * 0.1,
          };
        });
      }
      return true;
    },
    stage() {
      const t = TIME.value - castAt;
      return t < T_TELE ? 'телеграф' : t < T_TELE + T_FALL ? 'осыпание'
        : t < T_TELE + T_FALL + T_HOLD ? 'зона стоит' : 'тает';
    },
  };
})();

// ───────────────────────────────────────────────────────────────────────────
// СЦЕНАРИЙ: цикл из четырёх кастов; клавиши перебивают
// ───────────────────────────────────────────────────────────────────────────
const active = new Set();
function castSkill(s, arg) { s.begin(arg); active.add(s); }

const SCRIPT = [
  { skill: wave, gap: 0.8 },
  { skill: shield, arg: true, gap: 0.8 },   // этот щит разобьют
  { skill: rain, gap: 0.8 },
  { skill: shield, arg: false, gap: 0.8 },  // этот доживёт и растает
];
let scriptIdx = 0, nextCastAt = 0.6;
let currentLabel = null;

const PIN_SKILL = { wave, shield, rain }[params.get('skill') ?? ''] ?? null;
const PIN_T = num('t', NaN);
const pinned = PIN_SKILL && Number.isFinite(PIN_T);

function tickScript() {
  if (pinned) return;
  if (TIME.value >= nextCastAt) {
    const step = SCRIPT[scriptIdx % SCRIPT.length];
    scriptIdx++;
    castSkill(step.skill, step.arg);
    currentLabel = step.skill;
    nextCastAt = TIME.value + step.skill.dur + step.gap;
  }
}

addEventListener('keydown', (e) => {
  const s = { Digit1: wave, Digit2: shield, Digit3: rain }[e.code];
  if (!s) return;
  castSkill(s, s === shield ? scriptIdx % 2 === 0 : undefined);
  currentLabel = s;
  nextCastAt = TIME.value + s.dur + 0.8;
});

// ───────────────────────────────────────────────────────────────────────────
// камера, ввод, цикл
// ───────────────────────────────────────────────────────────────────────────
const LOOK = new THREE.Vector3(4.0, 1.2, 1.2);
let camYaw = num('yaw', -0.55), camPitch = num('pitch', 0.46), camDist = num('dist', 21);
function placeCamera() {
  const cy = Math.cos(camPitch) * camDist;
  camera.position.set(
    LOOK.x + Math.sin(camYaw) * cy,
    LOOK.y + Math.sin(camPitch) * camDist,
    LOOK.z + Math.cos(camYaw) * cy,
  );
  camera.lookAt(LOOK);
}
placeCamera();

let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button === 2) { dragging = true; lx = e.clientX; ly = e.clientY; }
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camYaw -= (e.clientX - lx) * 0.006;
  camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY - ly) * 0.004, 0.06, 1.35);
  lx = e.clientX; ly = e.clientY;
  placeCamera();
});
addEventListener('wheel', (e) => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.02, 9, 60);
  placeCamera();
}, { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hud = document.getElementById('hud');
const clock = new THREE.Clock();
let acc = 0, frames = 0, fps = 0, ms = 0, msAcc = 0, lastWall = performance.now();

let pinInit = false;
function frame(dt) {
  const now = TIME.value;
  tickScript();
  if (pinned) {
    /* Инициализация один раз, дальше — только удержание фазы: begin() на
       каждый кадр значит всплеск частиц на каждый кадр. */
    if (!pinInit) { pinInit = true; PIN_SKILL.pin(PIN_T, params.get('broken') === '1'); }
    else PIN_SKILL.hold(PIN_T);
    active.add(PIN_SKILL); currentLabel = PIN_SKILL;
  }
  for (const s of [...active]) if (!s.update(dt)) active.delete(s);
  poseCreature(now, dt);
  tickLights();
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  TIME.value += dt;
  frame(dt);
  if (post) post.render(); else renderer.render(scene, camera);

  const wall = performance.now();
  msAcc += wall - lastWall; lastWall = wall;
  acc += dt; frames++;
  if (acc >= 0.5) { fps = frames / acc; ms = msAcc / frames; msAcc = 0; acc = 0; frames = 0; }
  drawHud();
});

/* Прогрев: конвейеры компилируются при первой встрече с материалом, и без
   этого первый показанный кадр уходит пустым (вывод стенда /ice). */
{
  TIME.value = 0.001;
  frame(0.001);
  if (post) { await post.renderAsync(); await post.renderAsync(); }
  else { await renderer.renderAsync(scene, camera); await renderer.renderAsync(scene, camera); }
}

function drawHud() {
  const info = renderer.info?.render ?? {};
  const cur = currentLabel;
  const stage = cur && active.has(cur) ? `${cur.name} · ${cur.stage()}` : 'между кастами';
  hud.innerHTML =
    `<b>МОРОЗНОЕ СУЩЕСТВО</b> · frost · ${stage}<br>` +
    `<span class="dim">скиллы</span> волна · щит · дождь<br>` +
    `<span class="dim">draw calls</span> <b>${info.drawCalls ?? '—'}</b> · ` +
    `<span class="dim">tri</span> ${((info.triangles ?? 0) / 1000).toFixed(0)}k<br>` +
    `<span class="dim">кадр</span> <b>${ms.toFixed(2)} мс</b> · ${fps.toFixed(0)} fps<br>` +
    `<span class="dim">${renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · ` +
    `bloom ${glowOn ? 'on' : 'off'} · пол ${DARK_FLOOR ? 'тёмный' : 'белый'}</span>`;
}
</script>
