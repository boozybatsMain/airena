<!--
  СТЕНД «ЛЁД» — один эффект, собранный целиком на нашем стеке.

  Зачем он есть. Референс основателя (`achrefelouafi/LinearAbiltyCastingThreeJS`)
  написан на сыром GLSL через `ShaderMaterial`, а `WebGPURenderer` такой материал
  не рендерит в принципе (§9.1). Спор «перепишется или нет» нельзя выиграть
  рассуждением — его выигрывает один собранный эффект. Это он.

  Что здесь проверяется, по пунктам:
    1. Процедурная геометрия кристалла (чистый JS, из референса переносится
       дословно) действительно даёт силуэт, которого стоковыми примитивами нет.
    2. Слоистый лёд — градиент по высоте, френелевый кант, прожилки шумом —
       пишется на TSL и работает на обоих бэкендах.
    3. Этот лёд ЧИТАЕТСЯ НА БЕЛОМ ПОЛУ §10.1. Это и есть главный риск: у
       референса тёмный собор и HDRI, у нас белая платформа и один ключевой
       свет, и половина их эффекта — окружение, а не шейдер.
    4. Бюджет: 3 draw call на поле кристаллов, как в референсе, и счётчик в углу.

  Параметры адреса — те же, что у вьювера, и по той же причине: путь, который
  нельзя пройти по своей воле, — это путь, который никто не проверял.
    ?bloom=0  — без постобработки
    ?webgl=1  — принудительный WebGL2-фолбэк
    ?dark=1   — тёмный пол, чтобы увидеть, сколько именно съедает белый
-->

<script type="module">
import * as THREE from 'three';
import {
  float, vec3, vec4, uv, uniform, attribute, positionLocal, positionWorld,
  normalView, positionViewDirection, cameraProjectionMatrix, modelViewMatrix,
  mix, smoothstep, pow, abs as tabs, length, dot, oneMinus, max as tmax,
  mx_noise_float, mx_fractal_noise_float, mrt, output as tslOutput, pass,
} from 'three/tsl';

const params = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
const fail = (m) => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; console.error(m); };

/* ── ПАЛИТРА ЭЛЕМЕНТА ───────────────────────────────────────────────────────
   Взята дословно из `src/skills/registry.js`, элемент `frost`. Один источник
   на сервер и на экран: если палитра разъедется, разъедется и грамматика. */
const FROST = ['#e8fbff', '#7fe3e0', '#1f8f9d'].map((h) => new THREE.Color(h));
const [C_RIM, C_MID, C_DEEP] = FROST;

// ───────────────────────────────────────────────────────────────────────────
// сцена, рендерер, свет — как в арене (§10.1)
// ───────────────────────────────────────────────────────────────────────────
const DARK_FLOOR = params.get('dark') === '1';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f14);
scene.fog = new THREE.Fog(0x101620, 42, 120);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 400);

let renderer;
const forceWebGL = params.get('webgl') === '1';
try {
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL });
  await renderer.init();
} catch (e) {
  fail(`WebGPU unavailable (${e.message}) — falling back to WebGL2`);
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: true });
  await renderer.init();
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

/* ── ИЗБИРАТЕЛЬНОЕ СВЕЧЕНИЕ ────────────────────────────────────────────────
   Порогового bloom тут быть не может: самая большая и самая неподвижная
   поверхность кадра — белая платформа, и порог засветил бы именно её. Растровый
   проход пишет второй выход `bloomIntensity`, и заполняют его ТОЛЬКО помеченные
   материалы. Метка ставится единственной функцией ниже — и только если конвейер
   действительно собрался: материал с `mrtNode` при проходе без MRT компилируется
   в пустую структуру выхода и не рисуется вовсе. */
let post = null;
let glowOn = false;
const wantBloom = params.get('bloom') !== '0';
try {
  if (!wantBloom) throw new Error('выключено параметром ?bloom=0');
  const { bloom } = await import('three/addons/tsl/display/BloomNode.js');
  const scenePass = pass(scene, camera);
  scenePass.setMRT(mrt({ output: tslOutput, bloomIntensity: float(0) }));
  const colour = scenePass.getTextureNode('output');
  const glow = scenePass.getTextureNode('bloomIntensity');
  post = new THREE.PostProcessing(renderer);
  post.outputNode = colour.add(bloom(colour.mul(glow), 0.42, 0.8, 0));
  glowOn = true;
} catch (e) {
  if (wantBloom) fail(`bloom unavailable (${e.message}) — рисуем без постобработки`);
}

/**
 * `amount` — не только число, но и УЗЕЛ, и это главное здесь.
 *
 * Помеченный целиком материал светится целиком: замерено на этом же стенде —
 * при `amount = 1` ледяное поле над белой платформой уходило в ровный белый,
 * а с `?bloom=0` тот же лёд честно бирюзовый. То есть свечение съедало
 * единственную ось грамматики, которая существует ради вида (§8: элемент —
 * это только визуал). Поэтому метка берёт МАСКУ: у кристалла в bloom попадает
 * кант, а не тело; у плиты — жилка трещины, а не наледь.
 */
function markGlow(material, amount = 1) {
  if (!glowOn) return material;
  const node = typeof amount === 'number' ? float(amount) : amount;
  try { material.mrtNode = mrt({ bloomIntensity: node }); } catch { /* без MRT */ }
  return material;
}

scene.add(new THREE.HemisphereLight(0xdfe6f2, 0x2a2f38, 1.4));
const key = new THREE.DirectionalLight(0xfff4e0, 2.5);
key.position.set(16, 26, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -24; key.shadow.camera.right = 24;
key.shadow.camera.top = 24; key.shadow.camera.bottom = -24;
key.shadow.camera.near = 1; key.shadow.camera.far = 80;
key.shadow.bias = -0.0011;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 0.85);
rim.position.set(-16, 10, -14);
scene.add(rim);

/* Вспышка удара. Источник заведён СРАЗУ и гасится яркостью, а не удалением:
   `WebGPURenderer` пересобирает конвейер материалов, когда меняется ЧИСЛО
   источников в сцене, и создавать свет на каждое попадание значит
   пересобирать шейдеры посреди боя. */
const hitLight = new THREE.PointLight(0x9fe8ff, 0, 14, 2);
scene.add(hitLight);

// платформа
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(19, 96),
  new THREE.MeshStandardMaterial({
    color: DARK_FLOOR ? 0x151a22 : 0xf2f1ec,
    roughness: 0.86, metalness: 0.04,
  }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* Граница мира: тонкое светящееся кольцо. Это телеграф, а не тело, — правило
   эмиссии §10.1 оно не нарушает. */
{
  const edge = new THREE.Mesh(
    new THREE.RingGeometry(18.9, 19.2, 128),
    markGlow(new THREE.MeshBasicNodeMaterial({ color: 0x2e6f7d, transparent: true, opacity: 0.85 }), 0.7),
  );
  edge.rotation.x = -Math.PI / 2;
  edge.position.y = 0.012;
  scene.add(edge);
}

// ───────────────────────────────────────────────────────────────────────────
// ГЕОМЕТРИЯ КРИСТАЛЛА — чистый JS, ноль шейдера
//
// Это тот самый кусок референса, который переносится дословно: `BufferGeometry`
// одинакова на WebGL и на WebGPU, и переписывать здесь нечего. Приём оттуда же:
// углы дрожат ОДИН раз и общие для всех колец — иначе грани закручиваются
// винтом вместо непрерывных рёбер; неровность растёт к вершине — кристалл
// примерно круглый там, где вышел из пола, и рваный там, где его сломало;
// вершина сдвинута с оси, чтобы читалась как скол, а не как макушка конуса.
// Геометрия НЕиндексированная с плоскими нормалями — это и делает грани резкими.
// ───────────────────────────────────────────────────────────────────────────
const HEIGHT = 1;                     // строим ровно единичной высоты: тогда
                                      // `positionLocal.y` в шейдере — это 0..1

function crystalGeometry(rnd, { sides = 6, rings = 5 } = {}) {
  const ang = [];
  for (let i = 0; i < sides; i++) ang.push((i / sides) * Math.PI * 2 + (rnd() - 0.5) * 0.42);

  const bendA = rnd() * Math.PI * 2;
  const bend = 0.10 + rnd() * 0.20;   // одно направление изгиба на кристалл:
  const bx = Math.cos(bendA) * bend;  // поле наклоняется убедительно, а не
  const bz = Math.sin(bendA) * bend;  // одинаково закручивается

  const base = 0.16 + rnd() * 0.07;
  const taper = 0.55 + rnd() * 0.3;

  /* Кольца. `t` — доля высоты; профиль сужается степенью, а не линейно, иначе
     кристалл читается как карандаш. */
  const ringPts = [];
  for (let r = 0; r < rings; r++) {
    const t = Math.pow(r / rings, 0.88) + (rnd() - 0.5) * 0.04;   // дрожь высоты
    const y = Math.max(0, Math.min(0.94, t)) * HEIGHT;            // не выше плеча
    const rad = base * Math.pow(1 - t * taper, 0.7);
    const rough = 0.06 + t * 0.34;                                // рвань к вершине
    const pts = [];
    for (let i = 0; i < sides; i++) {
      const a = ang[i];
      const rr = rad * (1 + (rnd() - 0.5) * rough);
      pts.push([Math.cos(a) * rr + bx * t * t, y, Math.sin(a) * rr + bz * t * t]);
    }
    ringPts.push(pts);
  }
  const apex = [bx * 0.9 + (rnd() - 0.5) * base * 0.5, HEIGHT,
                bz * 0.9 + (rnd() - 0.5) * base * 0.5];

  const pos = [];
  const push = (p) => { pos.push(p[0], p[1], p[2]); };
  for (let r = 0; r < rings - 1; r++) {
    const a = ringPts[r], b = ringPts[r + 1];
    for (let i = 0; i < sides; i++) {
      const j = (i + 1) % sides;
      push(a[i]); push(b[i]); push(b[j]);
      push(a[i]); push(b[j]); push(a[j]);
    }
  }
  const top = ringPts[rings - 1];
  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    push(top[i]); push(apex); push(top[j]);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();          // на неиндексированной — плоские грани
  geo.computeBoundingSphere();
  return geo;
}

/* Три варианта, не один: поле из одинаковых кристаллов читается как тираж.
   Три — это и три draw call, ровно как у референса на его ледяное поле. */
const VARIANTS = 3;
const mulberry = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const variantGeos = Array.from({ length: VARIANTS }, (_, i) =>
  crystalGeometry(mulberry(1917 + i * 7919), { sides: 6 + (i % 2), rings: 5 }));

// ───────────────────────────────────────────────────────────────────────────
// МАТЕРИАЛ ЛЬДА — TSL
//
// Прозрачности здесь нет намеренно. `transmission` у `MeshPhysicalMaterial` —
// это отдельный проход по сцене, и он показывает то, что ПОЗАДИ: над белой
// платформой позади белое, то есть честная физика даёт ровный белый лёд.
// Поэтому лёд написан как ПЛОТНОЕ тело с четырьмя слоями, и каждый слой
// отвечает за то, чем лёд отличается от куска пластика:
//   глубина — насыщенный низ, выбеленная вершина (толща тем синее, чем толще);
//   френель — кант по касательным граням, единственное, что светится;
//   прожилки — шум по МИРОВЫМ координатам, поэтому соседние кристаллы не
//     повторяются, хотя геометрий всего три;
//   иней    — мелкая крошка у самого основания, где лёд сросся с полом.
// ───────────────────────────────────────────────────────────────────────────
const TIME = uniform(0);
const uGrow = uniform(0);      // 0..1 общая фаза роста (для эмиссии всплеска)
const uFade = uniform(1);      // 1 → 0, угасание в конце каста

function iceMaterial() {
  const m = new THREE.MeshStandardNodeMaterial({ metalness: 0.05, roughness: 0.22 });

  const h = positionLocal.y.div(HEIGHT).saturate();

  /* Френель по вью-нормали. Именно он делает лёд льдом: на белом полу
     светится КАНТ, а не объём, и силуэт остаётся читаемым. */
  const fres = oneMinus(tabs(dot(normalView, positionViewDirection))).pow(2.1).saturate();

  /* Прожилки — по мировым координатам: три геометрии, но ни одного
     повторяющегося кристалла в кадре. */
  const veins = mx_fractal_noise_float(positionWorld.mul(2.9), 3, 2.0, 0.5, 1).mul(0.5).add(0.5);
  const cracks = smoothstep(0.46, 0.54, veins);

  /* Иней у основания: там, где лёд вышел из плиты, он мутный, а не стеклянный. */
  const rime = oneMinus(smoothstep(0.0, 0.28, h));

  const deep = vec3(C_DEEP.r, C_DEEP.g, C_DEEP.b);
  const midc = vec3(C_MID.r, C_MID.g, C_MID.b);
  const rimc = vec3(C_RIM.r, C_RIM.g, C_RIM.b);

  const body = mix(deep, midc, h.pow(0.62));
  const withVeins = mix(body, rimc, cracks.mul(0.28));
  const withRime = mix(withVeins, rimc.mul(0.86), rime.mul(0.4));

  /* Френель тянет к белому — и на белом полу перетянутый френель стирает
     кристалл целиком. 0.42 подобрано глазом ПРОТИВ белого пола, а не против
     тёмного: тёмный прощает всё, белый не прощает ничего. */
  const tinted = mix(withRime, rimc, fres.mul(0.42));

  /* Прижать основание. Без этого лёд висит над плитой: у контакта нет
     ни тени, ни потемнения, и глаз читает наклейку, а не тело. */
  m.colorNode = tinted.mul(h.mul(0.3).add(0.7));

  /* Эмиссия — только кант и только вершина, и только пока идёт всплеск.
     Тело не светится никогда: это правило §10.1, и здесь оно принуждено тем,
     что метку получает единственный материал и единственной функцией. */
  const flare = fres.pow(1.6).mul(0.85).add(h.pow(4.0).mul(0.4)).mul(uGrow.mul(0.5).add(0.5));
  m.emissiveNode = rimc.mul(flare.mul(uFade).mul(0.9));

  /* В bloom уходит ТА ЖЕ маска, что светится. Иначе размывается силуэт
     целиком и лёд превращается в белую кляксу — проверено на белом полу. */
  return markGlow(m, flare.mul(uFade).saturate());
}
const ICE_MAT = iceMaterial();

// ───────────────────────────────────────────────────────────────────────────
// ПОЛ: НАЛЕДЬ И ТРЕЩИНЫ — TSL
//
// Аддитив на белом полу не добавляет ничего: белое плюс свет остаётся белым.
// Поэтому плита рисуется ОБЫЧНЫМ блендингом насыщенным цветом элемента, а
// светится в ней только жилка трещины — она и попадает в bloom.
// ───────────────────────────────────────────────────────────────────────────
const uFront = uniform(0);     // как далеко ушёл фронт разлома, 0..1
const uLen = uniform(1);

function frostSlabMaterial() {
  const m = new THREE.MeshBasicNodeMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  });

  /* Плита лежит вдоль каста: uv.x — вдоль, uv.y — поперёк, обе в -1..1. */
  const p = uv().mul(2).sub(1);
  const along = p.x.mul(0.5).add(0.5);          // 0 у кастера, 1 у цели
  const across = tabs(p.y);

  /* Ширина конуса растёт от кастера к точке удара — это и есть «разлом
     раскрывается в стену клинков». */
  const halfW = float(0.16).add(along.pow(1.35).mul(0.78));

  /* Край плиты — не прямая: изломан шумом, иначе читается как коврик. */
  const wob = mx_fractal_noise_float(vec3(along.mul(7.0), p.y.mul(3.0), 0.0), 3, 2.0, 0.5, 1).mul(0.13);
  const edge = oneMinus(smoothstep(halfW.add(wob).sub(0.1), halfW.add(wob), across));

  /* Фронт: всё, что дальше фронта, ещё не появилось. */
  const front = oneMinus(smoothstep(uFront, uFront.add(0.09), along));

  /* Трещины: ветвящиеся линии, идущие ВДОЛЬ каста. Гребень шума (|n| около
     нуля) — это и есть тонкая линия, и ветвится она бесплатно, потому что
     ветвится сам гребень. Два масштаба: магистральные разломы и волосяные. */
  const n1 = mx_fractal_noise_float(vec3(along.mul(3.6), p.y.mul(4.6), 11.0), 4, 2.0, 0.55, 1);
  const ridge = oneMinus(smoothstep(0.0, 0.09, tabs(n1)));
  const n2 = mx_fractal_noise_float(vec3(along.mul(9.5), p.y.mul(11.0), 3.0), 3, 2.0, 0.5, 1);
  const hair = oneMinus(smoothstep(0.0, 0.035, tabs(n2))).mul(0.62);
  const crack = tmax(ridge, hair).mul(edge).mul(front);

  /* Наледь: мутное поле внутри плиты, гуще у кастера. */
  const grain = mx_fractal_noise_float(vec3(along.mul(7.5), p.y.mul(7.5), 21.0), 3, 2.0, 0.5, 1).mul(0.5).add(0.5);
  const ice = edge.mul(front).mul(grain.mul(0.5).add(0.5)).mul(oneMinus(along).mul(0.35).add(0.65));

  const deep = vec3(C_DEEP.r, C_DEEP.g, C_DEEP.b);
  const rimc = vec3(C_RIM.r, C_RIM.g, C_RIM.b);
  const midc = vec3(C_MID.r, C_MID.g, C_MID.b);

  /* ТРЕЩИНА НА БЕЛОМ ПОЛУ — ТЁМНАЯ, А НЕ СВЕТЛАЯ, И ЭТО НЕ ВКУС.
     Референс рисует разлом светящейся жилкой, и на его тёмном соборе это
     верно. На белой платформе §10.1 светлая жилка совпадает с фоном и
     исчезает: разлом — это ЩЕЛЬ, то есть отсутствие света. Поэтому ядро
     трещины уходит в глубокий сине-зелёный, и лишь самая её середина
     остаётся горячей — иней по краям скола. */
  const gap = vec3(0.03, 0.16, 0.20);
  const core = oneMinus(smoothstep(0.55, 1.0, crack));   // 1 в теле трещины
  const hot = smoothstep(0.82, 1.0, crack);              // 1 только в середине

  const slabIce = mix(deep, midc, grain.mul(0.55));
  m.colorNode = mix(mix(slabIce, gap, oneMinus(core).mul(0.92)), rimc, hot.mul(0.75));
  /* Наледь непрозрачнее, чем хочется «на глаз на тёмном»: на белом полу
     полупрозрачная наледь исчезает вовсе, и плита перестаёт объяснять,
     ОТКУДА вылез лёд. */
  m.opacityNode = ice.mul(0.7).add(crack.mul(0.95)).mul(uFade).saturate();

  /* Светится только горячая середина скола — не вся плита. */
  return markGlow(m, hot.mul(uFade).saturate());
}

/* Плита кладётся в XZ НА УРОВНЕ ГЕОМЕТРИИ, а не поворотом меша: с поворотом
   вокруг X доворот вдоль каста пришлось бы делать третьим углом Эйлера, и он
   уводит плиту из плоскости пола. После `rotateX(-90°)` локальный X смотрит в
   мировой X, и остаётся ровно один поворот — вокруг вертикали. */
const slabGeo = new THREE.PlaneGeometry(1, 1);
slabGeo.rotateX(-Math.PI / 2);
const slab = new THREE.Mesh(slabGeo, frostSlabMaterial());
slab.position.y = 0.02;
slab.renderOrder = 2;
scene.add(slab);

// ───────────────────────────────────────────────────────────────────────────
// МОРОЗНАЯ ПЫЛЬ — один инстансированный пул, интеграция аналитическая
//
// Приём из референса (`ParticleSystem.js`): позиция считается из времени
// рождения прямо в вершинном узле, ноль аллокаций после конструктора. Код —
// не оттуда: там сырой GLSL, тут TSL, то есть одно и то же на обоих бэкендах.
// ───────────────────────────────────────────────────────────────────────────
const MAX_MOTES = 420;

class Motes {
  constructor(blending, tint) {
    const quad = new THREE.PlaneGeometry(1, 1);
    const geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.attributes.position = quad.attributes.position;
    geo.attributes.uv = quad.attributes.uv;
    geo.instanceCount = MAX_MOTES;

    const f = (n) => new THREE.InstancedBufferAttribute(new Float32Array(MAX_MOTES * n), n);
    this.aPos = f(3); this.aVel = f(3); this.aLife = f(3);   // born, life, size
    geo.setAttribute('aPos', this.aPos);
    geo.setAttribute('aVel', this.aVel);
    geo.setAttribute('aLife', this.aLife);
    /* Живём вне поля зрения, пока не выпущены. */
    for (let i = 0; i < MAX_MOTES; i++) this.aLife.array[i * 3 + 1] = -1;

    const aPos = attribute('aPos', 'vec3');
    const aVel = attribute('aVel', 'vec3');
    const aLife = attribute('aLife', 'vec3');

    const age = TIME.sub(aLife.x);
    const t01 = age.div(aLife.y).saturate();
    const alive = smoothstep(0.0, 0.02, age).mul(oneMinus(smoothstep(0.75, 1.0, t01)));

    /* Аналитика: сносит вбок, тормозит, чуть падает. Ни одного шага
       интегрирования на процессоре. */
    const drag = oneMinus(pow(oneMinus(t01), 2.0));
    const world = aPos.add(aVel.mul(drag).mul(aLife.y))
      .add(vec3(0, float(-1.1).mul(age).mul(age).mul(0.5), 0));

    const size = aLife.z.mul(oneMinus(t01).pow(0.45)).mul(smoothstep(0.0, 0.1, t01).mul(0.5).add(0.5));

    const mat = new THREE.MeshBasicNodeMaterial({
      transparent: true, depthWrite: false, blending, side: THREE.DoubleSide,
    });
    /* Билборд: квад разворачивается к камере в вью-пространстве. */
    mat.vertexNode = cameraProjectionMatrix.mul(
      modelViewMatrix.mul(vec4(world, 1)).add(vec4(positionLocal.xy.mul(size), 0, 0)),
    );
    const d = length(uv().sub(0.5)).mul(2);
    const disc = oneMinus(smoothstep(0.35, 1.0, d));
    mat.colorNode = vec3(tint.r, tint.g, tint.b);
    mat.opacityNode = disc.mul(alive).mul(uFade).mul(0.85);
    markGlow(mat, blending === THREE.AdditiveBlending ? 1 : 0);

    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = 4;
    this.head = 0;
    scene.add(this.mesh);
  }

  emit(n, fn) {
    for (let k = 0; k < n; k++) {
      const i = this.head; this.head = (this.head + 1) % MAX_MOTES;
      const { pos, vel, life, size } = fn(k);
      this.aPos.array.set(pos, i * 3);
      this.aVel.array.set(vel, i * 3);
      this.aLife.array[i * 3] = TIME.value;
      this.aLife.array[i * 3 + 1] = life;
      this.aLife.array[i * 3 + 2] = size;
    }
    this.aPos.needsUpdate = this.aVel.needsUpdate = this.aLife.needsUpdate = true;
  }
}

/* ДВА пула, и это не роскошь: аддитив не читается на белом полу, обычный
   блендинг не даёт свечения на тёмном фоне. Каждый честно делает своё. */
const moteBody = new Motes(THREE.NormalBlending, C_DEEP);
const moteGlow = new Motes(THREE.AdditiveBlending, C_RIM);

// ───────────────────────────────────────────────────────────────────────────
// РАСКЛАДКА КАСТА
// ───────────────────────────────────────────────────────────────────────────
const FROM = new THREE.Vector3(-9.5, 0, 1.5);
const TO = new THREE.Vector3(7.5, 0, -1.5);
const DIR = TO.clone().sub(FROM);
const LEN = DIR.length();
DIR.normalize();
const SIDE = new THREE.Vector3(-DIR.z, 0, DIR.x);

slab.scale.set(LEN * 1.06, 1, 7.2);
slab.position.copy(FROM).addScaledVector(DIR, LEN / 2);
slab.position.y = 0.02;
/* Локальный +X плиты должен лечь на DIR. Поворот вокруг Y на θ переводит
   (1,0,0) в (cosθ, 0, −sinθ), значит cosθ = dx, sinθ = −dz. */
slab.rotation.y = Math.atan2(-DIR.z, DIR.x);
uLen.value = LEN;

/* Кристаллы: ствол разлома + стена клинков в точке удара. Всего 264 — тот же
   порядок, что у референса на его ледяное поле (288), и те же 3 draw call. */
const N_LANCE = 190;
const N_WALL = 74;
const crystals = [];
{
  const rnd = mulberry(20260901);
  for (let i = 0; i < N_LANCE; i++) {
    /* Плотнее у кастера: `t` тянется к нулю степенью. */
    const t = Math.pow(rnd(), 1.55);
    const lateral = (rnd() - 0.5) * 2 * (0.45 + Math.pow(t, 1.3) * 2.2);
    const p = FROM.clone().addScaledVector(DIR, t * LEN).addScaledVector(SIDE, lateral);
    /* Наклон наружу от оси: поле раскрывается, а не стоит частоколом. */
    const lean = (0.12 + rnd() * 0.4) * Math.sign(lateral || 1) * (0.4 + t);
    crystals.push({
      v: i % VARIANTS, p,
      yaw: rnd() * Math.PI * 2,
      tiltX: (rnd() - 0.5) * 0.3,
      tiltZ: lean,
      h: (0.55 + rnd() * 1.5) * (1.15 - t * 0.35),
      w: 0.7 + rnd() * 0.7,
      born: t * 0.92 + rnd() * 0.05,          // рождается, когда фронт дошёл
    });
  }
  for (let i = 0; i < N_WALL; i++) {
    /* Стена: дуга поперёк, у самой точки удара, выше и злее. */
    const u = (i / (N_WALL - 1) - 0.5) * 2;
    const p = TO.clone()
      .addScaledVector(SIDE, u * 3.4 + (rnd() - 0.5) * 0.5)
      .addScaledVector(DIR, -Math.abs(u) * 1.5 + (rnd() - 0.5) * 0.7);
    crystals.push({
      v: i % VARIANTS, p,
      yaw: rnd() * Math.PI * 2,
      tiltX: (rnd() - 0.5) * 0.22 - 0.16,
      tiltZ: u * 0.55 + (rnd() - 0.5) * 0.2,
      h: 1.5 + rnd() * 2.4 * (1 - Math.abs(u) * 0.45),
      w: 0.9 + rnd() * 0.8,
      born: 0.9 + rnd() * 0.1,
    });
  }
}

const buckets = Array.from({ length: VARIANTS }, () => []);
crystals.forEach((c) => buckets[c.v].push(c));

const meshes = buckets.map((list, v) => {
  const m = new THREE.InstancedMesh(variantGeos[v], ICE_MAT, list.length);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.castShadow = true;
  m.receiveShadow = false;
  m.frustumCulled = false;
  scene.add(m);
  return m;
});

/* Матрицы пересобираются на процессоре каждый кадр — 264 композиции, это
   ничто, зато каждый параметр остаётся живым и ни один буфер не пересоздаётся.
   Приём из референса: хранить ПАРАМЕТРЫ, а не запечённые матрицы. */
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _s = new THREE.Vector3();
const _p = new THREE.Vector3();

/* Упругий выход: кристалл выскакивает с перелётом, а не выезжает. */
const BACK_C1 = 1.70158, BACK_C3 = BACK_C1 + 1;
const easeOutBack = (x) => 1 + BACK_C3 * Math.pow(x - 1, 3) + BACK_C1 * Math.pow(x - 1, 2);

function layout(phase) {
  for (let v = 0; v < VARIANTS; v++) {
    const list = buckets[v];
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const a = THREE.MathUtils.clamp((phase - c.born) / 0.22, 0, 1);
      const g = a <= 0 ? 0 : easeOutBack(a);
      _e.set(c.tiltX, c.yaw, c.tiltZ);
      _q.setFromEuler(_e);
      _s.set(c.w * g, c.h * g, c.w * g);
      /* Утоплен на время роста: кристалл ВЫХОДИТ из плиты, а не стоит на ней. */
      _p.set(c.p.x, -0.12 * c.h * (1 - a), c.p.z);
      _m.compose(_p, _q, _s);
      meshes[v].setMatrixAt(i, _m);
    }
    meshes[v].instanceMatrix.needsUpdate = true;
  }
}

// ───────────────────────────────────────────────────────────────────────────
// ФАЗЫ КАСТА
// ───────────────────────────────────────────────────────────────────────────
const T_TRAVEL = 0.62;    // фронт доходит до цели
const T_HOLD = 1.05;      // стоит
const T_FADE = 0.95;      // тает
const T_TOTAL = T_TRAVEL + T_HOLD + T_FADE;
const T_GAP = 0.55;

let castAt = 0;
let lastImpact = -1;

function cast() { castAt = TIME.value; lastImpact = -1; }

function update(now) {
  const t = now - castAt;

  let front, grow, fade, phase;
  if (t < T_TRAVEL) {
    front = t / T_TRAVEL;
    phase = front;
    grow = 1; fade = 1;
  } else if (t < T_TRAVEL + T_HOLD) {
    front = 1; phase = 1; fade = 1;
    grow = Math.max(0, 1 - (t - T_TRAVEL) / 0.4);
  } else {
    front = 1; phase = 1; grow = 0;
    fade = Math.max(0, 1 - (t - T_TRAVEL - T_HOLD) / T_FADE);
  }

  uFront.value = front;
  uGrow.value = grow;
  uFade.value = fade;
  layout(phase * (t < T_TRAVEL ? 1 : 1));

  /* Пыль вдоль фронта — пока он идёт. */
  if (t < T_TRAVEL) {
    const p = FROM.clone().addScaledVector(DIR, front * LEN);
    const n = 3;
    const spawn = (k) => {
      const s = (Math.random() - 0.5) * 2 * (0.5 + front * 2.2);
      const o = p.clone().addScaledVector(SIDE, s);
      return {
        pos: [o.x, 0.1 + Math.random() * 0.35, o.z],
        vel: [(Math.random() - 0.5) * 1.4 + DIR.x * 1.6, 0.9 + Math.random() * 1.7,
              (Math.random() - 0.5) * 1.4 + DIR.z * 1.6],
        life: 0.55 + Math.random() * 0.6,
        size: 0.07 + Math.random() * 0.13,
      };
    };
    moteBody.emit(n, spawn);
    moteGlow.emit(2, spawn);
  }

  /* Удар — ровно один раз, когда фронт дошёл. */
  if (lastImpact < 0 && t >= T_TRAVEL) {
    lastImpact = t;
    hitLight.position.set(TO.x, 1.6, TO.z);
    hitLight.userData.until = now + 0.26;
    const spawn = () => {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 2.6;
      return {
        pos: [TO.x + Math.cos(a) * r * 0.4, 0.25 + Math.random() * 1.4, TO.z + Math.sin(a) * r * 0.4],
        vel: [Math.cos(a) * (2.5 + Math.random() * 4), 1.6 + Math.random() * 3.6,
              Math.sin(a) * (2.5 + Math.random() * 4)],
        life: 0.6 + Math.random() * 0.7,
        size: 0.08 + Math.random() * 0.2,
      };
    };
    moteBody.emit(52, spawn);
    moteGlow.emit(34, spawn);
  }

  /* Гаснет по кривой, а не выключателем. */
  const left = (hitLight.userData.until ?? 0) - now;
  hitLight.intensity = left > 0 ? Math.pow(left / 0.26, 1.6) * 34 : 0;

  return { t, front, fade };
}

// ───────────────────────────────────────────────────────────────────────────
// камера, ввод, цикл
// ───────────────────────────────────────────────────────────────────────────
/* Камера смотрит на СЕРЕДИНУ каста, а не в центр арены: эффект — это
   семнадцать метров разлома, и кадр должен быть про него. */
const LOOK = FROM.clone().addScaledVector(DIR, LEN * 0.55).setY(1.6);
/* Угол камеры выведен в адрес намеренно. Наклон решает, СКОЛЬКО стоит след на
   полу: при нашем боевом ~24° плита почти всегда перекрыта самими кристаллами,
   а у референса камера MOBA-высоты, и там след — половина эффекта. Это
   сравнение нельзя провести по памяти, его надо снять. */
const num = (k, d) => { const v = parseFloat(params.get(k) ?? ''); return Number.isFinite(v) ? v : d; };
let camYaw = num('yaw', -0.42), camPitch = num('pitch', 0.42), camDist = num('dist', 19);
function placeCamera() {
  const cy = Math.cos(camPitch) * camDist;
  camera.position.set(
    LOOK.x + Math.sin(camYaw) * cy,
    LOOK.y + Math.sin(camPitch) * camDist,
    LOOK.z + Math.cos(camYaw) * cy,
  );
  camera.lookAt(LOOK);
}
placeCamera();

let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button === 2) { dragging = true; lx = e.clientX; ly = e.clientY; }
  else cast();
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  camYaw -= (e.clientX - lx) * 0.006;
  camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY - ly) * 0.004, 0.06, 1.35);
  lx = e.clientX; ly = e.clientY;
  placeCamera();
});
addEventListener('wheel', (e) => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.02, 9, 60);
  placeCamera();
}, { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hud = document.getElementById('hud');
const clock = new THREE.Clock();
let acc = 0, frames = 0, fps = 0, ms = 0, msAcc = 0, lastWall = performance.now();

/* Рендер СИНХРОННЫЙ. `renderAsync` в цикле анимации складывает промисы:
   кадр не ждёт предыдущего, очередь растёт, и замер начинает мерить не кадр,
   а глубину этой очереди. Отсюда и брались первые 120 мс. */
/* `?t=1.2` — заморозить каст на этой секунде. Цикл при этом НЕ выключается:
   на скрытой вкладке `requestAnimationFrame` встаёт, и одиночный рендер вне
   цикла до композитора не доходит — кадр уходит чёрным. Поэтому фаза
   прижимается внутри цикла, а не вместо него. */
const PIN = parseFloat(params.get('t') ?? '');
const pinned = Number.isFinite(PIN);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  TIME.value += dt;
  const now = TIME.value;

  if (pinned) castAt = now - PIN;
  const st = update(now);
  if (!pinned && st.t > T_TOTAL + T_GAP) cast();

  if (post) post.render(); else renderer.render(scene, camera);

  /* Меряем ПО СТЕНЕ между кадрами, а не вокруг вызова рендера: на WebGPU
     вызов только ставит работу в очередь и возвращается почти мгновенно. */
  const wall = performance.now();
  msAcc += wall - lastWall; lastWall = wall;

  acc += dt; frames++;
  if (acc >= 0.5) { fps = frames / acc; ms = msAcc / frames; msAcc = 0; acc = 0; frames = 0; }

  drawHud(st);
});

/* ── СЕЙВ-ТОЧКА ДЛЯ СНИМКОВ ────────────────────────────────────────────────
   `?t=1.2` замораживает каст на этой секунде и рисует один кадр. Нужно ровно
   затем же, зачем `?bloom=0`: фазу эффекта нельзя обсуждать по памяти, её надо
   показать. Заодно это единственный способ снять стенд там, где `requestAnimationFrame`
   не идёт — в скрытой панели или в headless-снимке. */
async function seek(t) {
  castAt = TIME.value - t;
  const st = update(TIME.value);
  /* ДВА кадра, и это не перестраховка. `WebGPURenderer` компилирует конвейер
     материала при первой встрече с ним, и первый кадр с новым материалом
     уходит пустым. Для цикла это невидимо, для одиночного снимка — это чёрный
     экран, который легко принять за сломанный эффект. */
  if (post) { await post.renderAsync(); await post.renderAsync(); }
  else { await renderer.renderAsync(scene, camera); await renderer.renderAsync(scene, camera); }
  drawHud(st);
  return st;
}
window.__ice = { seek, cast, T_TRAVEL, T_HOLD, T_FADE, T_TOTAL };

/* Один прогрев до первого кадра цикла: компиляция конвейеров стоит десятки
   миллисекунд, и без него первый показанный кадр — пустой. */
await seek(pinned ? PIN : 0);

function drawHud(st) {
  const info = renderer.info?.render ?? {};
  const stage = st.t < T_TRAVEL ? 'разлом идёт'
    : st.t < T_TRAVEL + T_HOLD ? 'стена стоит'
    : st.t < T_TOTAL ? 'тает' : 'пауза';
  hud.innerHTML =
    `<b>ЛЁД</b> · frost · ${stage}<br>` +
    `<span class="dim">кристаллов</span> ${crystals.length} <span class="dim">в</span> ${VARIANTS} <span class="dim">draw call</span><br>` +
    `<span class="dim">частиц</span> ${MAX_MOTES * 2} <span class="dim">пул</span><br>` +
    `<span class="dim">draw calls</span> <b>${info.drawCalls ?? '—'}</b> · ` +
    `<span class="dim">tri</span> ${((info.triangles ?? 0) / 1000).toFixed(0)}k<br>` +
    `<span class="dim">кадр</span> <b>${ms.toFixed(2)} мс</b> · ${fps.toFixed(0)} fps<br>` +
    `<span class="dim">${renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · ` +
    `bloom ${glowOn ? 'on' : 'off'} · пол ${DARK_FLOOR ? 'тёмный' : 'белый'}</span>`;
}
</script>
