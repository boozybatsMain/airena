<title>Airena — экран боя (макет)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Chakra+Petch:wght@700&display=swap">

<style>
/* ── Экран боя, макет под UI-референс. Только визуал. ─────────────────────
   Шрифт: Michroma — свободный аналог Eurostile Bold Extended из референса.
   Панели: SVG с обводкой по контуру (включая срезанный угол) и потёртостями
   из /assets/grunge.jpg (fal), эмблемы — /assets/emblem-*.jpg (fal). */
:root{
  --cy:#4fc8dc; --cy-hi:#9fe8f2; --or:#f39a35; --or-hi:#ffc37a;
  --ink:#e8f1f7; --dim:#93a5b4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f16}
body{font-family:"Rajdhani",sans-serif;font-weight:500;color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none}
canvas{display:block}

#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:
    radial-gradient(120% 90% at 50% 42%, transparent 52%, rgba(3,7,13,.42) 100%),
    linear-gradient(to bottom, rgba(6,12,20,.32) 0%, transparent 13%),
    linear-gradient(to top, rgba(4,9,16,.45) 0%, transparent 14%);}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .clicky{pointer-events:auto}

/* ── карточки бойцов ──────────────────────────────────────────────────────
   Размеры по линейке референса: высота эмблемы = высоте всей стопки справа
   (имя 28 + 12 + бар 26 + 14 + слоты 50 = 130). */
.card{position:absolute;top:24px;display:flex;gap:20px;align-items:flex-start}
.card.left{left:26px}
.card.right{right:26px;flex-direction:row-reverse}
.card .col{display:flex;flex-direction:column}
.card.right .col{align-items:flex-end}

.emblem{width:120px;height:120px;flex:0 0 120px}

.fname{height:26px;margin-top:6px;font-size:24px;font-weight:500;letter-spacing:.1em;line-height:25px;margin-left:-2px;
  color:#74c6d4;text-shadow:0 0 16px rgba(95,180,200,.35),0 0 5px rgba(90,170,190,.2)}
.card.right .fname{letter-spacing:.06em;margin-left:0;margin-right:-2px;
  color:#cf854a;text-shadow:0 0 16px rgba(210,140,75,.32),0 0 5px rgba(200,130,70,.2)}

.hprow{display:flex;align-items:center;gap:16px;margin-top:10px;height:20px}
.card.right .hprow{flex-direction:row-reverse}
.hpbar{width:380px;height:16px;display:block;overflow:visible}
.hppct{font-size:21px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;color:#77c9d7;
  letter-spacing:.02em;min-width:56px;text-shadow:0 0 12px rgba(95,180,200,.3)}
.card.right .hppct{text-align:right;color:#cf854a;text-shadow:0 0 12px rgba(210,140,75,.25)}
.card.left .hppct{text-align:left}

.skills{display:flex;gap:8px;margin-top:8px}
.sk{position:relative;width:50px;height:50px;display:grid;place-items:center;
  border-radius:3px;border:1px solid transparent;background:rgba(10,18,28,.18)}
.sk::after{content:"";position:absolute;inset:-1px;border-radius:inherit;
  background:url(/assets/grunge-cy.png) center/340% no-repeat;
  opacity:.24;pointer-events:none}
.card.right .sk::after{background-image:url(/assets/grunge-or.png)}
.skills .sk:nth-child(1)::after{background-position:8% 12%}
.skills .sk:nth-child(2)::after{background-position:52% 71%}
.skills .sk:nth-child(3)::after{background-position:87% 33%}
.skills .sk:nth-child(4)::after{background-position:23% 88%}
.skills .sk:nth-child(5)::after{background-position:66% 9%}
.card.right .skills .sk:nth-child(1)::after{background-position:91% 64%}
.card.right .skills .sk:nth-child(2)::after{background-position:14% 42%}
.card.right .skills .sk:nth-child(3)::after{background-position:71% 86%}
.card.right .skills .sk:nth-child(4)::after{background-position:38% 18%}
.sk svg{width:29px;height:29px;fill:#7fd0dd;opacity:.92}
.card.right .sk svg{fill:#dd9c62}
.sk.count,.card.right .sk.count{box-shadow:none;color:#e6eef4;font-size:19px;font-weight:500}
.card.right .sk.count.plus{border-color:rgba(243,154,53,.6);color:#f5a545}
.sk.count::after{opacity:.15}

/* ── часы и раунд ─────────────────────────────────────────────────────── */
#clock{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
#clock .t{font-size:48px;font-weight:600;letter-spacing:.04em;line-height:1;
  font-variant-numeric:tabular-nums;color:#eef6fa}


/* ── заголовки-«гребёнки»: // ТЕКСТ ────── со стрелкой, как в референсе ── */
.hcut{display:flex;align-items:center;gap:10px;font-size:15px;
  letter-spacing:.16em;color:#74b4c6;white-space:nowrap}
.hcut::before{content:"//";letter-spacing:.05em;color:rgba(127,210,226,.85)}
.hcut svg{flex:0 0 auto;margin-top:2px}

/* ── лента арены: без плашек и линий, просторные строки ───────────────── */
#feed{position:absolute;left:28px;bottom:35%;width:400px}
#feed::before{content:"";position:absolute;left:-18px;top:-14px;width:226px;bottom:-16px;
  z-index:-1;background:rgba(8,15,24,.5);border-radius:18px;filter:blur(20px)}
#feed::after{content:"";position:absolute;left:206px;top:28px;width:128px;bottom:-12px;
  z-index:-1;background:rgba(8,15,24,.28);border-radius:18px;filter:blur(22px)}
#feed .hcut{position:relative}
#feed .hcut svg{position:absolute;left:0;top:0;width:400px;height:40px;pointer-events:none}
#feed .rows{margin-top:15px;display:flex;flex-direction:column;gap:9px}
#feed .row{display:grid;grid-template-columns:44px 24px 112px 1fr;gap:10px;white-space:nowrap;
  align-items:center;opacity:0;transform:translateY(-4px);
  animation:feedin .3s ease forwards}
@keyframes feedin{to{opacity:1;transform:none}}
#feed .tm{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:#adbac4}
#feed .ic{display:grid;place-items:center}
#feed .ic svg{width:16px;height:16px}
#feed .who{font-size:14px;font-weight:500;letter-spacing:.05em}
#feed .what{font-size:14px;font-weight:500;letter-spacing:.04em;color:#dde6ec}

/* ── статистика матча: срез TL и BR, рамка по контуру, одна линия ─────── */
#stats{position:absolute;left:28px;bottom:44px;width:300px;height:220px}
#stats::before{content:"";position:absolute;inset:-14px -18px;z-index:-1;
  background:rgba(8,15,24,.46);border-radius:20px;filter:blur(22px)}
#stats .bg{position:absolute;inset:0;background:rgba(10,18,28,.18);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
#stats>svg{position:absolute;inset:0;pointer-events:none}
#stats .in{position:absolute;inset:0;padding:19px 24px 14px}
#stats .hcut{font-size:15px;letter-spacing:.12em}
#stats .hunder{width:236px;height:1px;margin:8px 0 2px;
  background:linear-gradient(90deg,rgba(127,210,226,.5) 0 62%,rgba(127,210,226,.18))}
#stats .row{display:flex;justify-content:space-between;align-items:baseline;
  padding:13px 0 0}
#stats .row:first-of-type{padding-top:12px}
#stats .k{font-size:13.5px;font-weight:500;letter-spacing:.08em;color:#b6c3cf}
#stats .v{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;color:#6fd0e0}

/* ── неймплейты в мире ────────────────────────────────────────────────── */
.np{position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:5px;z-index:8}
.np .n{font-size:12.5px;font-weight:500;letter-spacing:.1em}
.np.cy .n{color:#cff5fc;text-shadow:0 1px 2px rgba(5,10,16,.6)}
.np.or .n{color:#ffa63e;text-shadow:0 1px 2px rgba(5,10,16,.6)}
.np .b{width:118px;height:5px;background:rgba(6,12,20,.75);border:1px solid rgba(0,0,0,.5);
  display:flex;overflow:hidden}
.np .b .f{height:100%;background:var(--cy);transition:width .2s}
.np.or .b .f{background:var(--or)}
.np.or .b::before{content:"";width:4px;align-self:stretch;background:#f39a35;margin-right:1px}
.np .b .d{height:100%;background:#e04c3c;transition:width .6s ease}
.np .n .dia{font-size:10px;vertical-align:0;margin-right:6px}

#boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0b0f16;
  font-size:11px;letter-spacing:.4em;color:#8ba0b2}
#err{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:31;
  max-width:70ch;color:#ff8a7a;font:12px/1.5 monospace;
  white-space:pre-wrap;display:none}
</style>

        <div class="sk" title="cluster"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3 C17 3 21 6.5 21 12 C21 17.5 17 21 12 21 C7 21 3 17.5 3 12 C3 6.5 7 3 12 3 Z M9 8.4 a1.7 1.7 0 1 0 0 3.4 a1.7 1.7 0 0 0 0-3.4 Z M15 8.4 a1.7 1.7 0 1 0 0 3.4 a1.7 1.7 0 0 0 0-3.4 Z M9 13.6 a1.7 1.7 0 1 0 0 3.4 a1.7 1.7 0 0 0 0-3.4 Z M15 13.6 a1.7 1.7 0 1 0 0 3.4 a1.7 1.7 0 0 0 0-3.4 Z"/></svg></div>

  <!-- правый боец: зеркально, срез левого нижнего угла -->

    <svg class="emblem" viewBox="0 0 130 130">

        <path d="M115 90 h7 M117 95 h5"/>
      </g>

      <image href="/assets/grunge-or.png" x="-48" y="-27" width="185" height="185"
        clip-path="url(#ep-g)" opacity=".3" preserveAspectRatio="xMidYMid slice"/>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import * as TSL from 'three/tsl';

const $ = (s) => document.querySelector(s);
const errBox = $('#err');
const fail = (m) => { errBox.style.display = 'block'; errBox.textContent += m + '\n'; console.error(m); };
const params = new URLSearchParams(location.search);

// ── пол с технической разметкой ──────────────────────────────────────────
function floorTexture() {
  const S = 2048, M = S / 64;            // тайл 64×64 м → 32 px/м
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#d6dade'; g.fillRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2;
  const px = (m) => m * M;

  // швы панелей
  g.strokeStyle = 'rgba(70,80,92,.14)'; g.lineWidth = 2;
  for (let m = -32; m <= 32; m += 4) {
    g.beginPath(); g.moveTo(cx + px(m), 0); g.lineTo(cx + px(m), S); g.stroke();
    g.beginPath(); g.moveTo(0, cy + px(m)); g.lineTo(S, cy + px(m)); g.stroke();
  }
  g.strokeStyle = 'rgba(70,80,92,.2)'; g.lineWidth = 3;
  for (let m = -32; m <= 32; m += 8) {
    g.beginPath(); g.moveTo(cx + px(m), 0); g.lineTo(cx + px(m), S); g.stroke();
    g.beginPath(); g.moveTo(0, cy + px(m)); g.lineTo(S, cy + px(m)); g.stroke();
  }

  // радиальные спицы до кольца
  g.strokeStyle = 'rgba(70,80,92,.28)'; g.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * px(2.6), cy + Math.sin(a) * px(2.6));
    g.lineTo(cx + Math.cos(a) * px(R_ARENA), cy + Math.sin(a) * px(R_ARENA));
    g.stroke();
  }

  // центральный узор
  const circle = (r, w, alpha, dash) => {
    g.strokeStyle = `rgba(80,90,102,${alpha})`; g.lineWidth = w;
    g.setLineDash(dash || []);
    g.beginPath(); g.arc(cx, cy, px(r), 0, Math.PI * 2); g.stroke();
    g.setLineDash([]);
  };
  circle(2.4, 4, .62); circle(1.7, 3, .55); circle(5.2, 2.5, .4, [14, 10]);
  circle(R_ARENA - 0.55, 2, .3); circle(R_ARENA + 0.55, 2, .22);
  g.fillStyle = 'rgba(95,105,118,.4)';
  g.beginPath(); g.arc(cx, cy, px(0.55), 0, Math.PI * 2); g.fill();

  // штриховки у кольца и мелкие метки
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + 0.12;
    const r0 = px(R_ARENA - 1.7);
    g.save(); g.translate(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); g.rotate(a + Math.PI / 2);
    g.fillStyle = 'rgba(80,90,102,.3)';
    for (let s = 0; s < 4; s++) g.fillRect(-14 + s * 9, -3, 5, 6);
    g.restore();
  }
  g.font = `${Math.round(M * 0.55)}px monospace`;
  g.fillStyle = 'rgba(85,95,108,.4)';
  const rng = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  for (let i = 0; i < 26; i++) {
    const a = rng() * Math.PI * 2, r = px(4 + rng() * (R_ARENA - 6));
    g.save(); g.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    g.fillText(`${String.fromCharCode(65 + (i % 6))}-${(10 + i)}`, 0, 0); g.restore();
  }

  // растворяем разметку к краю тайла, чтобы шов с внешним полом не читался
  const fade = g.createRadialGradient(cx, cy, px(24), cx, cy, px(31));
  fade.addColorStop(0, 'rgba(214,218,222,0)');
  fade.addColorStop(1, 'rgba(214,218,222,1)');
  g.fillStyle = fade; g.fillRect(0, 0, S, S);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// ── контейнеры-препятствия ───────────────────────────────────────────────
const stencil = (text, size = 256) => {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.font = `700 ${size * 0.42}px "Chakra Petch", sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(72,80,90,.85)';
  g.fillText(text, size / 2, size / 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
};
const hazard = () => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#c9cdd3'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#3c434d';
  for (let x = -64; x < 256; x += 42) {
    g.beginPath(); g.moveTo(x, 64); g.lineTo(x + 24, 0); g.lineTo(x + 42, 0); g.lineTo(x + 18, 64);
    g.closePath(); g.fill();
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
};

const boxMat = () => new THREE.MeshStandardMaterial({ color: 0xe9e8e3, roughness: 0.62, metalness: 0.06 });
const boxTop = () => new THREE.MeshStandardMaterial({ color: 0xd8d7d1, roughness: 0.6, metalness: 0.08 });

function container(w, h, d, label) {
  const grp = new THREE.Group();
  const side = boxMat(), top = boxTop();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, top, side, side, side]);
  body.position.y = h / 2;
  body.castShadow = true; body.receiveShadow = true;
  grp.add(body);
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(body.geometry),
    new THREE.LineBasicMaterial({ color: 0x8b939e, transparent: true, opacity: 0.8 }),
  );
  edge.position.y = h / 2;
  grp.add(edge);
  // угловые накладки
  const capM = new THREE.MeshStandardMaterial({ color: 0xc6cad0, roughness: 0.5, metalness: 0.3 });
  for (const sx of [-1, 1]) for (const sy of [0, 1]) for (const sz of [-1, 1]) {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.24), capM);
    cap.position.set(sx * (w / 2 - 0.02), sy * h + (sy ? -0.12 : 0.12), sz * (d / 2 - 0.02));
    cap.castShadow = true;
    grp.add(cap);
  }
  // трафарет и предупредительная полоса на фронтальной грани (+z)
  if (label) {
    const num = new THREE.Mesh(
      new THREE.PlaneGeometry(1.1, 1.1),
      new THREE.MeshStandardMaterial({ map: stencil(label), transparent: true, roughness: 0.7 }),
    );
    num.position.set(w / 2 - 0.75, h * 0.62, d / 2 + 0.012);
    grp.add(num);
  }
  const strip = new THREE.Mesh(
    new THREE.PlaneGeometry(Math.min(w * 0.5, 2.4), 0.24),
    new THREE.MeshStandardMaterial({ map: hazard(), roughness: 0.7 }),
  );
  strip.position.set(-w / 4, 0.32, d / 2 + 0.012);
  grp.add(strip);
  return grp;
}

function wedge(runX, h, d, label) {
  // прямоугольный клин: вертикальная грань слева, скат вниз направо
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(0, h); shape.lineTo(runX, 0); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
  geo.translate(-runX / 2, 0, -d / 2);
  const m = new THREE.Mesh(geo, boxMat());
  m.castShadow = true; m.receiveShadow = true;
  const grp = new THREE.Group();
  grp.add(m);
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x8b939e, transparent: true, opacity: 0.8 }),
  );
  grp.add(edge);
  if (label) {
    const num = new THREE.Mesh(
      new THREE.PlaneGeometry(0.9, 0.9),
      new THREE.MeshStandardMaterial({ map: stencil(label), transparent: true, roughness: 0.7 }),
    );
    num.position.set(-runX / 2 + 0.7, h * 0.35, d / 2 + 0.012);
    grp.add(num);
  }
  return grp;
}

// ── бойцы: настоящие тела проекта ────────────────────────────────────────
// В симуляции радиусы 1.0/1.25 м; для макета тела крупнее — читаемость
// с дальней камеры важнее физического масштаба. Только визуал.
const FIGHTER_RADIUS = { octopus: 1.0 * 1.7, gorilla: 1.25 * 1.5 };

async function loadBody(name) {
  const src = await (await fetch(`/bodies/${name}.js`)).text();
  const make = new Function('THREE', 'TSL', `${src}\n;return build(THREE, TSL);`);
  const root = make(THREE, TSL);
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const raw = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(); raw.getSize(size);
  const footprint = Math.max(size.x, size.z) || 1;
  root.scale.setScalar((FIGHTER_RADIUS[name] * 2) / footprint);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const s2 = new THREE.Vector3(); box.getSize(s2);
  const meshes = [];
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    meshes.push(o);
  });
  return { root, meshes, height: s2.y, length: Math.max(s2.x, s2.z) || 2.5 };
}

function lowestY(body) {
  let lo = Infinity;
  for (const o of body.meshes) {
    const bb = o.geometry.boundingBox, e = o.matrixWorld.elements;
    const ax = e[1], ay = e[5], az = e[9];
    const c = ax * (bb.min.x + bb.max.x) / 2 + ay * (bb.min.y + bb.max.y) / 2
      + az * (bb.min.z + bb.max.z) / 2 + e[13];
    const r = Math.abs(ax) * (bb.max.x - bb.min.x) / 2
      + Math.abs(ay) * (bb.max.y - bb.min.y) / 2
      + Math.abs(az) * (bb.max.z - bb.min.z) / 2;
    if (c - r < lo) lo = c - r;
  }
  return lo;
}

// цветное кольцо под бойцом
function groundRing(hex, r) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 30, 128, 128, 118);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(.72, hex + '26');
  grad.addColorStop(.9, hex + 'cc');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = hex; g.lineWidth = 5; g.globalAlpha = .95;
  g.beginPath(); g.arc(128, 128, 108, 0, Math.PI * 2); g.stroke();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(r * 2.4, r * 2.4),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending,
      depthWrite: false, toneMapped: false, opacity: 0.9 }),
  );
  mesh.rotation.x = -Math.PI / 2; mesh.position.y = 0.045; mesh.renderOrder = 3;
  return mesh;
}

// ── эффекты скиллов (упрощённые, только для картинки) ────────────────────
const fx = [];
function beamFx(from, to, life = 0.5) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(0.16, 0.16, len, 8);
  geo.rotateX(Math.PI / 2);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x7fdcff, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  });
  glowMat.color.multiplyScalar(2.2);
  const m = new THREE.Mesh(geo, glowMat);
  m.position.copy(from).addScaledVector(dir, 0.5);
  m.lookAt(to);
  const coreGeo = new THREE.CylinderGeometry(0.05, 0.05, len, 8);
  coreGeo.rotateX(Math.PI / 2);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true,
    opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  coreMat.color.setRGB(4, 4, 4);
  const core = new THREE.Mesh(coreGeo, coreMat);
  m.add(core);
  scene.add(m);
  const flash = new THREE.PointLight(0x9fe8ff, 30, 9);
  flash.position.copy(to);
  scene.add(flash);
  fx.push({ life, t: 0, update(dt) {
    this.t += dt; const k = 1 - this.t / this.life;
    m.material.opacity = 0.55 * k; core.material.opacity = k; flash.intensity = 30 * k;
    if (this.t >= this.life) { scene.remove(m, flash); return false; }
    return true;
  } });
}
function shockFx(x, z, hex, life = 0.6) {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(0.35, 1.05, 48),
    (() => { const mm = new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, side: THREE.DoubleSide });
      mm.color.multiplyScalar(2.4); return mm; })(),
  );

// ── прошорканные рамки: сегментный штрих + эрозия, свой seed на элемент ──
const mulberry = (seed) => () => {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

/**
 * Контур задаётся полилинией; каждый кусок в 6-10 px рисуется своим штрихом
 * со случайной толщиной и плотностью, потом всё проезжают царапины и
 * вытертые пятна через destination-out — краска сходит, как на референсе.
 */
function wornTex(w, h, seed, color, shapes, opts = {}) {
  const jitter = opts.jitter === undefined ? 1.05 : opts.jitter;
  const tickN = opts.ticks === undefined ? 3 : opts.ticks;
  const S = 2;
  const c = document.createElement('canvas');
  c.width = w * S; c.height = h * S;
  const g = c.getContext('2d');
  g.scale(S, S);
  const rnd = mulberry(seed);
  const base = opts.base || 1.15;
  g.lineCap = 'round';
  // мел, который плохо пишет: два медленных синуса по длине дуги дают
  // яркость «изредка хорошо, чаще бледно», без резких обрубков
  const f1 = 0.045 + rnd() * 0.03, f2 = 0.011 + rnd() * 0.009;
  const ph1 = rnd() * 7, ph2 = rnd() * 7;
  let arc = rnd() * 40;
  for (const pts of shapes) {
    const closed = opts.open ? 0 : 1;
    for (let i = 0; i < pts.length - 1 + closed; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const steps = Math.max(1, Math.round(len / 4));
      for (let k = 0; k < steps; k++) {
        const t0 = k / steps, t1 = (k + 1) / steps;
        arc += len / steps;
        const n = (0.5 + 0.5 * Math.sin(arc * f1 + ph1))
                * (0.5 + 0.5 * Math.sin(arc * f2 + ph2));
        const alpha = 0.14 + 0.72 * Math.pow(n, 1.5) + rnd() * 0.08;
        const wdt = base * (0.55 + 0.45 * n + rnd() * 0.12 * jitter);
        const x0 = a[0] + (b[0] - a[0]) * t0, y0 = a[1] + (b[1] - a[1]) * t0;
        const x1 = b[0] === a[0] && b[1] === a[1] ? x0 : a[0] + (b[0] - a[0]) * t1;
        const y1 = a[1] + (b[1] - a[1]) * t1;
        g.strokeStyle = `rgba(${color},${alpha.toFixed(2)})`;
        g.lineWidth = wdt;
        g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        // меловая пыль: слабый повтор со сдвигом поперёк
        if (rnd() < 0.4) {
          const nx = -(y1 - y0), ny = (x1 - x0);
          const nl = Math.hypot(nx, ny) || 1, off = (rnd() - 0.5) * 1.2;
          g.strokeStyle = `rgba(${color},${(alpha * 0.3).toFixed(2)})`;
          g.lineWidth = wdt * 0.55;
          g.beginPath();
          g.moveTo(x0 + nx / nl * off, y0 + ny / nl * off);
          g.lineTo(x1 + nx / nl * off, y1 + ny / nl * off);
          g.stroke();
        }
      }
      // редкие двойные фрагменты — параллельная короткая линия
      if (rnd() < 0.18 && len > 14) {
        const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
        const off = 2 + rnd() * 1.5, t0 = rnd() * 0.5, t1 = t0 + 0.2 + rnd() * 0.3;
        g.strokeStyle = `rgba(${color},${(0.2 + rnd() * 0.3).toFixed(2)})`;
        g.lineWidth = 0.8;
        g.beginPath();
        g.moveTo(a[0] + (b[0] - a[0]) * t0 + nx * off, a[1] + (b[1] - a[1]) * t0 + ny * off);
        g.lineTo(a[0] + (b[0] - a[0]) * t1 + nx * off, a[1] + (b[1] - a[1]) * t1 + ny * off);
        g.stroke();
      }
    }
    // засечки поперёк рамки возле случайных точек
    for (let i = 0; i < tickN + rnd() * tickN; i++) {
      const si = Math.floor(rnd() * (pts.length - 1));
      const a = pts[si], b = pts[si + 1] || pts[0];
      const t = rnd(), len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
      const px = a[0] + (b[0] - a[0]) * t, py = a[1] + (b[1] - a[1]) * t;
      g.strokeStyle = `rgba(${color},${(0.3 + rnd() * 0.35).toFixed(2)})`;
      g.lineWidth = 0.9;
      g.beginPath();
      g.moveTo(px - nx * 2.2, py - ny * 2.2);
      g.lineTo(px + nx * 2.2, py + ny * 2.2);
      g.stroke();
    }
  }
  // эрозия: тонкие царапины съедают краску
  g.globalCompositeOperation = 'destination-out';
  const n = Math.round((w + h) / 4.5);
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h;
    const ang = (rnd() < 0.7 ? -0.6 : 0.9) + (rnd() - 0.5) * 0.7;
    const len = 5 + rnd() * 34;
    g.strokeStyle = `rgba(0,0,0,${(0.15 + rnd() * 0.4).toFixed(2)})`;
    g.lineWidth = 0.3 + rnd() * 0.9;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  // вытертые пятна — краска сошла целыми участками
  for (let i = 0; i < 5 + rnd() * 5; i++) {
    const x = rnd() * w, y = rnd() * h, r = 3 + rnd() * 9;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(0,0,0,${(0.25 + rnd() * 0.35).toFixed(2)})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  return c.toDataURL();
}

// формы: скруглённые углы приближены короткими фасками
const rectPts = (w, h, r, cut, cutAt) => {
  const p = [];
  const C = (x, y) => p.push([x, y]);
  if (cutAt === 'br') {
    C(r, .8); C(w - r, .8); C(w - .8, r);                 // верх + правый верхний
    C(w - .8, h - cut); C(w - cut, h - .8);               // срез внизу справа
    C(r, h - .8); C(.8, h - r); C(.8, r);
  } else if (cutAt === 'bl') {
    C(r, .8); C(w - r, .8); C(w - .8, r);
    C(w - .8, h - r); C(w - r, h - .8);
    C(cut, h - .8); C(.8, h - cut); C(.8, r);
  } else {
    C(r, .8); C(w - r, .8); C(w - .8, r); C(w - .8, h - r);
    C(w - r, h - .8); C(r, h - .8); C(.8, h - r); C(.8, r);
  }
  return p;
};

function frame(dt, draw = true) {
  simNow += dt;
  const now = simNow;

  clock = Math.max(0, clock - dt);
  if (clock <= 0.01) clock = 102;
  $('#tval').textContent = mmss(clock);

  scriptT += dt;
  if (scriptT >= LOOP) { scriptT -= LOOP; fired.clear(); delays.length = 0; }
  for (const ev of script) {
    if (scriptT >= ev.at && !fired.has(ev.at)) { fired.add(ev.at); ev.run(); }
  }
  for (const d of [...delays]) {
    if (scriptT >= d.at) { delays.splice(delays.indexOf(d), 1); d.fn(); }
  }

  for (const fxi of [...fx]) if (!fxi.update(dt)) fx.splice(fx.indexOf(fxi), 1);

  const other = { laser: F.gorilla, gorilla: F.laser };
  for (const [id, f] of Object.entries(F)) {
    if (!f.body) continue;
    // движение к цели
    const dx = f.tx - f.x, dz = f.tz - f.z, dist = Math.hypot(dx, dz);
    let speedMs = 0;
    if (dist > 0.08) {
      const v = Math.min(dist * 2.2, id === 'laser' ? 4.2 : 3.4);
      f.x += (dx / dist) * v * dt; f.z += (dz / dist) * v * dt;
      speedMs = v;
    }
    // курс — на противника
    const o = other[id];
    const want = Math.atan2(o.x - f.x, o.z - f.z);
    let dh = (want - f.h) % (Math.PI * 2);
    if (dh > Math.PI) dh -= Math.PI * 2; if (dh < -Math.PI) dh += Math.PI * 2;
    f.h += dh * (1 - Math.exp(-6 * dt));

    // гейт по пройденному пути
    const moved = Math.hypot(f.x - f.lastX, f.z - f.lastZ);
    f.lastX = f.x; f.lastZ = f.z;
    f.stride += moved / (f.body.length * 0.9);

    // фаза действия
    let action = null, phase = 0;
    if (f.action) {
      f.actT += dt;
      phase = Math.min(1, f.actT / f.actDur);
      action = f.action;
      if (f.actT >= f.actDur) { f.action = null; }
    }

    const r = f.body.root;
    r.position.set(f.x, 0, f.z);
    r.rotation.set(0, f.h, 0, 'YXZ');
    r.userData.pose({
      t: now, dt,
      speed: Math.min(speedMs / (f.body.length * 0.9), 6),
      stride: f.stride, turn: 0, grounded: true,
      health: f.hp, action, phase,
    });
    r.updateMatrixWorld(true);
    r.position.y = Math.max(0, -lowestY(f.body));

    f.ring.position.set(f.x, 0.045, f.z);
    f.light.position.set(f.x, 1.6, f.z);

    place(f.plate, f.x, r.position.y + f.body.height + 0.55, f.z);
  }

  setHp(F.laser, document.getElementById('fill-l'), $('#pct-l'), F.laser.hp, false);
  setHp(F.gorilla, document.getElementById('fill-g'), $('#pct-g'), F.gorilla.hp, true);

  if (draw) renderer.render(scene, camera);
}
</script>
